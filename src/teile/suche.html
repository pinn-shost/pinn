<!-- Global search: the magnifier in the sidebar opens a search bar at the bottom, suggestions appear above it -->
<div id="globalSearchBackdrop" class="gs-backdrop" aria-hidden="true"></div>
<div id="globalSearch" class="gs-wrap" role="dialog" aria-label="Suche">
  <div class="gs-inner">
    <div id="globalSearchResults" class="gs-results" role="listbox" aria-label="Suchvorschläge"></div>
    <div id="globalSearchField" class="gs-field">
      <span class="gs-field-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20.5 20.5l-4.6-4.6"></path></svg></span>
      <input id="globalSearchInput" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off" placeholder="pinn. durchsuchen …" aria-label="Suchbegriff" />
      <button id="globalSearchClose" type="button" class="gs-close" aria-label="Suche schließen">×</button>
    </div>
  </div>
</div>
<div id="gsEventAnchor" aria-hidden="true"></div>

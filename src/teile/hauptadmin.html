<!-- Main admin: manage families (instead of the app) -->
<div id="mainAdminScreen" class="hidden pinn-auth-screen z-[390] bg-paper" data-no-term>
 <div class="pinn-auth-inner">
  <div class="w-full max-w-md">
    <div class="flex items-start justify-between gap-3 mb-6">
      <div class="min-w-0">
        <h1 class="font-serif text-2xl">Familien</h1>
        <p class="text-xs text-ink/40 mt-1">Angemeldet als Hauptadmin „<span id="mainAdminName"></span>“</p>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <button type="button" id="mainAdminLogoutBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-red-500 hover:border-red-500 transition">Abmelden</button>
        <button type="button" id="mainAdminPasswordBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition">Passwort ändern</button>
        <button type="button" id="mainAdminSetupBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition" data-no-i18n>⚙︎ Einrichtung</button>
        <button type="button" id="mainAdminSystemBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition">🛟 Sicherungen &amp; Updates</button>
        <button type="button" id="mainAdminErrLogBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition"><span>🧾 Fehlerprotokoll</span><span id="mainAdminErrLogBadge" class="el-badge hidden" data-no-i18n></span></button>
        <button type="button" id="mainAdminDevicesBtn" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition">📱 Meine Geräte</button>
      </div>
    </div>

    <!-- Setup open or restart pending (pb_public/einrichtung.js) -->
    <div id="mainAdminSetupBanner" class="hidden rounded-xl border border-ink/10 p-4 mb-6 bg-pine/5" data-no-i18n>
      <p id="mainAdminSetupBannerText" class="text-sm mb-3"></p>
      <button type="button" id="mainAdminSetupBannerBtn" class="w-full px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition"></button>
    </div>

    <form id="mainAdminCreateForm" class="rounded-xl border border-ink/10 p-4 mb-6" autocomplete="off">
      <h2 class="text-xs uppercase tracking-wide text-ink/40 mb-3">Neue Familie anlegen</h2>
      <label class="block text-xs text-ink/50 mb-1" for="mainAdminNewFamily">Name der Familie</label>
      <input id="mainAdminNewFamily" type="text" autocomplete="off" autocapitalize="words" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm mb-3" />
      <p class="block text-xs text-ink/50 mb-1">Wohnform</p>
      <div class="flex items-center gap-1 bg-ink/5 rounded-full p-1 text-xs w-fit mb-1" role="group" aria-label="Wohnform">
        <button type="button" data-ma-wohnform="familie" class="ma-wohnform-btn active px-3 py-1.5 rounded-full transition">👨‍👩‍👧 Familie</button>
        <button type="button" data-ma-wohnform="wg" class="ma-wohnform-btn px-3 py-1.5 rounded-full transition">🧑‍🤝‍🧑 WG</button>
      </div>
      <p class="text-[11px] text-ink/40 mb-3">Als WG heißen Familienmitglieder „Mitbewohner“, Kinder-Funktionen sind ausgeblendet. Später änderbar unter Einstellungen → Familienmitglieder.</p>
      <label class="block text-xs text-ink/50 mb-1" for="mainAdminNewAdmin">Name des Familien-Admins</label>
      <input id="mainAdminNewAdmin" type="text" autocomplete="off" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm mb-3" />
      <label class="block text-xs text-ink/50 mb-1" for="mainAdminNewPassword">Start-Passwort (mind. 8 Zeichen, muss beim ersten Anmelden geändert werden)</label>
      <input id="mainAdminNewPassword" type="password" autocomplete="new-password" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm mb-3" />
      <p id="mainAdminCreateStatus" class="hidden text-xs mb-3"></p>
      <button type="submit" id="mainAdminCreateBtn" class="w-full px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Familie anlegen</button>
    </form>

    <p id="mainAdminListStatus" class="hidden text-xs mb-3"></p>
    <div id="mainAdminFamilyList" class="flex flex-col gap-3"></div>
  </div>
 </div>
</div>

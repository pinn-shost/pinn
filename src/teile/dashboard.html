<!-- Family dashboard (iPad): profile selection instead of sign-in, see pb_hooks/dashboard.pb.js -->
<div id="dashboardScreen" class="hidden pinn-auth-screen z-[395] bg-paper">
  <div id="dashBg" class="dash-bg" aria-hidden="true"></div>
  <div class="dash-inner">
    <div class="dash-head">
      <div class="min-w-0">
        <h1 class="font-serif text-3xl leading-tight"><span data-tk="dashboard.family">Family</span> <span id="dashFamilyName"></span></h1>
        <p id="dashDate" class="text-sm text-ink/50 mt-1"></p>
      </div>
      <div id="dashClock" class="dash-clock"></div>
    </div>
    <div class="dash-main">
      <p data-tk="dashboard.whoIsStarting" id="dashQuestion" class="text-sm text-ink/50 mb-5 text-center">Who wants to get started? Tap your picture.</p>
      <div id="dashTiles" class="dash-grid"></div>
      <div id="dashStatusWrap" class="hidden flex flex-col items-center gap-3 mt-6 text-center">
        <p id="dashStatus" class="text-sm text-red-500"></p>
        <button data-tk="dashboard.tryAgain" type="button" id="dashRetryBtn" class="px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Try again</button>
      </div>
    </div>
    <div class="dash-footer">
      <button data-tk="dashboard.logInWithPassword" type="button" id="dashPasswordLoginBtn" class="text-xs text-ink/40 hover:text-pine underline decoration-dotted">Log in with password</button>
    </div>
  </div>
  <div id="dashBusy" class="hidden dash-busy"><span data-tk="dashboard.opening" id="dashBusyText">Opening …</span></div>
</div>

<!-- Password of a profile without a PIN (dashboard, since 1.118.4) - "fixed inset-0" so that js/tastatur.js
     moves it above the on-screen keyboard -->
<div id="dashPwOverlay" class="hidden fixed inset-0" role="dialog" aria-modal="true" aria-label="Password" data-tk-attr="aria-label:common.password">
  <form id="dashPwForm" class="dash-pw-box" autocomplete="off" novalidate>
    <div id="dashPwAvatar"></div>
    <div id="dashPwName" class="pin-title"></div>
    <p data-tk="dashboard.noPinYet" class="pin-sub">No PIN yet – please log in once with your password, then choose your PIN.</p>
    <input id="dashPwUser" type="text" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true" />
    <input data-tk-attr="placeholder:common.password" id="dashPwInput" type="password" autocomplete="current-password" class="dash-pw-input" placeholder="Password" />
    <div id="dashPwError" class="pin-error"></div>
    <div class="dash-pw-actions">
      <button data-tk="common.cancel" type="button" id="dashPwCancel" class="dash-pw-btn plain">Cancel</button>
      <button data-tk="common.next" type="submit" id="dashPwSubmit" class="dash-pw-btn">Next</button>
    </div>
  </form>
</div>

<!-- PIN entry (dashboard and "PIN festlegen" in the account) -->
<div id="pinPadOverlay" class="hidden" role="dialog" aria-modal="true" aria-label="PIN entry" data-tk-attr="aria-label:dashboard.pinEntry">
  <div id="pinPadBox" class="pin-box">
    <div id="pinPadAvatar" class="hidden"></div>
    <div id="pinPadTitle" class="pin-title"></div>
    <div id="pinPadSub" class="pin-sub"></div>
    <div id="pinPadLengths" class="pin-lengths hidden">
      <button data-tk="dashboard.fourDigits" type="button" class="pin-len-btn" data-pin-len="4">4 digits</button>
      <button data-tk="dashboard.sixDigits" type="button" class="pin-len-btn" data-pin-len="6">6 digits</button>
    </div>
    <div id="pinPadDots" class="pin-dots"></div>
    <div id="pinPadError" class="pin-error"></div>
    <div class="pin-keys">
      <button type="button" class="pin-key" data-pin-key="1"><span class="pin-digit">1</span><span class="pin-letters"></span></button>
      <button type="button" class="pin-key" data-pin-key="2"><span class="pin-digit">2</span><span class="pin-letters">ABC</span></button>
      <button type="button" class="pin-key" data-pin-key="3"><span class="pin-digit">3</span><span class="pin-letters">DEF</span></button>
      <button type="button" class="pin-key" data-pin-key="4"><span class="pin-digit">4</span><span class="pin-letters">GHI</span></button>
      <button type="button" class="pin-key" data-pin-key="5"><span class="pin-digit">5</span><span class="pin-letters">JKL</span></button>
      <button type="button" class="pin-key" data-pin-key="6"><span class="pin-digit">6</span><span class="pin-letters">MNO</span></button>
      <button type="button" class="pin-key" data-pin-key="7"><span class="pin-digit">7</span><span class="pin-letters">PQRS</span></button>
      <button type="button" class="pin-key" data-pin-key="8"><span class="pin-digit">8</span><span class="pin-letters">TUV</span></button>
      <button type="button" class="pin-key" data-pin-key="9"><span class="pin-digit">9</span><span class="pin-letters">WXYZ</span></button>
      <button data-tk="common.cancel" type="button" class="pin-key plain" id="pinPadCancel">Cancel</button>
      <button type="button" class="pin-key" data-pin-key="0"><span class="pin-digit">0</span><span class="pin-letters"></span></button>
      <button data-tk="common.delete" type="button" class="pin-key plain" id="pinPadDelete" aria-label="Delete" data-tk-attr="aria-label:common.delete">Delete</button>
    </div>
  </div>
</div>

    <section id="financeSection" class="hidden min-h-0 flex-col bg-white/40">
      <div class="px-4 sm:px-6 pt-4 pb-3 border-b border-ink/10 shrink-0">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <h2 data-tk="nav.finance" class="font-serif text-lg leading-tight">Finance</h2>
            <button id="kassePillFin" type="button" class="kasse-sub hidden" aria-label="Switch fund" data-tk-attr="aria-label:fin.switchFund"></button>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button id="openFinanceSettingsBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center" aria-label="Budget &amp; categories" title="Budget &amp; categories" data-tk-attr="aria-label:fin.settings.title;title:fin.settings.title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M1 14h6"></path><path d="M9 8h6"></path><path d="M17 16h6"></path></svg>
            </button>
            <button data-tk="fin.add.entry" id="openExpenseModalBtn" type="button" class="px-3 py-1.5 rounded-lg bg-pine text-white text-xs font-medium hover:bg-pine/90 transition whitespace-nowrap">+ Transaction</button>
          </div>
        </div>
        <!-- Switch: expenses / savings / pocket money / contracts -->
        <div class="flex items-center gap-1 bg-ink/5 rounded-full p-1 text-xs mt-3 w-full sm:w-fit" role="tablist" aria-label="Finance section" data-tk-attr="aria-label:fin.financeSection">
          <button data-tk="fin.expenses" type="button" data-fintab="ausgaben" class="fin-tab-btn flex-1 sm:flex-none px-4 py-1.5 rounded-full transition" role="tab">Expenses</button>
          <button data-tk="fin.savings" type="button" data-fintab="sparen" class="fin-tab-btn flex-1 sm:flex-none px-4 py-1.5 rounded-full transition" role="tab">Savings</button>
          <button data-tk="depot.pocketMoney" type="button" id="finTabTaschengeldBtn" data-fintab="taschengeld" class="fin-tab-btn flex-1 sm:flex-none px-4 py-1.5 rounded-full transition" role="tab">Pocket money</button>
          <button data-tk="contract.contracts" type="button" data-fintab="vertraege" class="fin-tab-btn flex-1 sm:flex-none px-4 py-1.5 rounded-full transition" role="tab">Contracts</button>
        </div>
        <div id="finPeriodBar" class="flex items-center gap-2 mt-3 flex-wrap">
          <div class="inline-flex rounded-lg border border-ink/15 p-0.5 shrink-0">
            <button data-tk="cal.week" type="button" data-period="week" class="fin-period-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Week</button>
            <button data-tk="cal.month" type="button" data-period="month" class="fin-period-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Month</button>
            <button data-tk="cal.year" type="button" data-period="year" class="fin-period-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Year</button>
          </div>
          <button data-tk="common.today" id="finTodayBtn" type="button" class="shrink-0 ml-auto sm:order-last sm:ml-0 px-2 py-1 rounded-lg border border-ink/15 text-[11px] text-ink/60 hover:text-pine hover:border-pine transition">Today</button>
          <div class="fin-period-nav flex items-center gap-1 w-full sm:w-auto sm:ml-auto min-w-0">
            <button id="finPrevBtn" type="button" class="shrink-0 w-9 h-9 rounded-full text-ink/60 hover:text-pine hover:bg-ink/5 grid place-items-center text-xl leading-none select-none" aria-label="Previous period" data-tk-attr="aria-label:fin.previousPeriod">‹</button>
            <span id="finPeriodLabel" class="flex-1 sm:flex-none sm:w-56 text-sm font-medium truncate text-center"></span>
            <button id="finNextBtn" type="button" class="shrink-0 w-9 h-9 rounded-full text-ink/60 hover:text-pine hover:bg-ink/5 grid place-items-center text-xl leading-none select-none" aria-label="Next period" data-tk-attr="aria-label:fin.nextPeriod">›</button>
          </div>
        </div>
        <!-- Contracts: search, status, category, sorting -->
        <div id="finContractBar" class="hidden mt-3 flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <div class="relative flex-1 min-w-0">
              <input id="contractSearchInput" type="search" autocomplete="off" placeholder="Contract, provider, customer number …" class="w-full rounded-lg border border-ink/15 pl-8 pr-2.5 py-1.5 text-base" aria-label="Search contracts"  data-tk-attr="placeholder:fin.contractProviderCustomerNumber;aria-label:fin.searchContracts"/>
              <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink/40 pointer-events-none" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            </div>
            <button data-tk="fin.due" id="contractDueToggle" type="button" class="vt-due-toggle shrink-0 px-2.5 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 transition whitespace-nowrap" title="Only contracts that need attention now" data-tk-attr="title:fin.onlyContractsThatNeed">⏰ Due</button>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="inline-flex rounded-lg border border-ink/15 p-0.5 shrink-0">
              <button data-tk="fin.running" type="button" data-cstatus="aktiv" class="contract-status-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Running</button>
              <button data-tk="fin.cancelled" type="button" data-cstatus="gekuendigt" class="contract-status-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Cancelled</button>
              <button data-tk="errorLog.all" type="button" data-cstatus="alle" class="contract-status-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">All</button>
            </div>
            <div class="flex items-center gap-2 ml-auto min-w-0 flex-1 justify-end">
              <select id="contractCategoryFilter" class="min-w-0 flex-1 rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white" aria-label="Category" data-tk-attr="aria-label:account.manage.category"></select>
              <select id="contractSortSelect" class="shrink-0 rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white" aria-label="Sorting" data-tk-attr="aria-label:pantry.sorting">
                <option data-tk="fin.byDeadline" value="frist">By deadline</option>
                <option data-tk="fin.byName" value="name">By name</option>
                <option data-tk="fin.byCost" value="kosten">By cost</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div id="financeScroll" class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-4">
        <div id="finPaneAusgaben" class="max-w-3xl mx-auto flex flex-col gap-4">
          <div id="finBudgetCard"></div>
          <div id="finSplitCard"></div>
          <div id="finTrendCard"></div>
          <div id="finExpenseListCard" class="scroll-mt-4"></div>
        </div>
        <div id="finPaneSparen" class="hidden max-w-3xl mx-auto flex flex-col gap-4"></div>
        <div id="finPaneTaschengeld" class="hidden max-w-3xl mx-auto flex flex-col gap-4"></div>
        <div id="finPaneVertraege" class="hidden max-w-3xl mx-auto flex flex-col gap-4"></div>
      </div>
    </section>

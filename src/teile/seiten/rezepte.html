    <!-- RIGHT: Recipes -->
    <section id="recipeSection" class="min-h-0 flex flex-col bg-white/40 border-ink/10">

      <div id="recipeListHeader" class="px-6 pt-4 pb-3 border-b border-ink/10 shrink-0">
        <div class="flex items-center justify-between gap-3">
          <h2 data-tk="recipe.title" id="recipeSectionTitle" class="font-serif text-lg">Recipes</h2>
          <button data-tk-attr="title:recipe.addMeal" id="addMealOverviewBtn" class="hidden px-3 py-1.5 rounded-lg bg-mustard text-white text-xs font-medium hover:bg-mustard/90 transition whitespace-nowrap shrink-0" title="Add meal">+<span data-tk="recipe.addMeal" class="hidden sm:inline"> Add meal</span></button>
          <div id="recipeControls" class="hidden items-center gap-2 shrink-0">
            <button data-tk-attr="title:recipe.whatCanICookTitle;aria-label:recipe.whatCanICook" id="openRecipeCookBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center text-base leading-none" aria-label="What can I cook?" title="What can I cook? (matched against the pantry)">🍳</button>
            <button data-tk-attr="title:recipe.catsTools;aria-label:recipe.catsTools" id="openRecipeSettingsBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center" aria-label="Categories &amp; kitchen appliances" title="Categories &amp; kitchen appliances">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M1 14h6"></path><path d="M9 8h6"></path><path d="M17 16h6"></path></svg>
            </button>
            <button data-tk="recipe.addBtn" data-tk-attr="title:recipe.add" id="openRecipeModalBtn" type="button" class="px-3 py-1.5 rounded-lg bg-pine text-white text-xs font-medium hover:bg-pine/90 transition whitespace-nowrap shrink-0" title="Add recipe">+ Recipe</button>
          </div>
        </div>
        <div id="recipeSourceToggle" class="hidden items-center gap-1 bg-ink/5 rounded-full p-1 text-xs w-fit mt-2.5">
          <button data-tk="recipe.own" type="button" data-source="eigene" class="recipe-source-btn px-3 py-1 rounded-full transition">Custom</button>
          <button data-tk="recipe.public" type="button" data-source="oeffentlich" class="recipe-source-btn px-3 py-1 rounded-full transition">🌍 Public</button>
        </div>
        <div id="recipeFilterBar" class="hidden">
          <div class="flex items-center gap-2 mt-3">
            <input data-tk-attr="placeholder:recipe.searchPlaceholder" id="recipeSearchInput" type="search" autocomplete="off" placeholder="Searching …" class="flex-1 min-w-0 rounded-lg border border-ink/15 px-3 py-1.5 text-base" />
            <button data-tk="recipe.favouritesFilter" id="recipeFavoritesToggle" type="button" class="pantry-chip shrink-0 px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 transition whitespace-nowrap" aria-pressed="false">♡ Favourites</button>
          </div>
          <div class="flex items-center gap-2 mt-2 mb-2 flex-wrap">
            <select data-tk-attr="aria-label:recipe.sorting" id="recipeSort" class="min-w-0 flex-1 sm:flex-none rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white" aria-label="Sorting">
              <option data-tk="recipe.sort.recent" value="hinzugefuegt">Recently added</option>
              <option data-tk="recipe.sort.title" value="titel">Title (A–Z)</option>
              <option data-tk="recipe.sort.fastest" value="schnellste">Fastest first</option>
              <option data-tk="recipe.sort.planned" value="geplant">Planned this week first</option>
            </select>
            <select data-tk-attr="aria-label:recipe.category" id="recipeCategoryFilter" class="min-w-0 flex-1 sm:flex-none rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white" aria-label="Category"></select>
            <select data-tk-attr="aria-label:recipe.tool" id="recipeToolFilter" class="min-w-0 flex-1 sm:flex-none rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white" aria-label="Kitchen appliance"></select>
          </div>
        </div>
        <span id="recipeCount" class="text-xs text-ink/40"></span>
      </div>

      <!-- Recipe list (incl. the week slider) -->
      <div id="recipeListContainer" class="flex-1 min-h-0 overflow-y-auto">
        <div id="recipeWeekSliderWrap" class="hidden px-6 pt-4">
          <h3 data-tk="recipe.plannedThisWeek" class="text-xs uppercase tracking-wide text-ink/40 mb-2">Planned this week</h3>
          <div id="recipeWeekSlider" class="flex gap-3 overflow-x-auto pb-3 -mx-6" style="scroll-snap-type: x proximity;"></div>
        </div>
        <div id="recipeFavSliderWrap" class="hidden px-6 pt-4">
          <h3 data-tk="recipe.favourites" class="text-xs uppercase tracking-wide text-ink/40 mb-2">Favourites</h3>
          <div id="recipeFavSlider" class="flex gap-3 overflow-x-auto pb-3 -mx-6" style="scroll-snap-type: x proximity;"></div>
        </div>
        <div class="px-6 py-4">
          <div id="recipeList" class="flex flex-col gap-3"></div>
          <p data-tk="recipe.empty" id="emptyRecipes" class="text-sm text-ink/40 italic mt-2">No recipes yet – add one.</p>
          <!-- Recycle bin: deleted recipes for 7 days (js/rezeptaktionen.js, since 1.118.3) -->
          <button type="button" id="recipeTrashBtn" class="hidden mt-4 px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/50 hover:text-pine hover:border-pine transition"></button>
        </div>
      </div>

      <!-- Recipe detail page: its own view instead of expanding in the list -->
      <div id="recipeDetailView" class="hidden flex-1 min-h-0 flex flex-col overflow-y-auto">
        <button id="recipeDetailBackBtn" class="sticky top-0 z-10 bg-paper/95 backdrop-blur px-4 py-3 border-b border-ink/10 flex items-center gap-1.5 text-sm font-medium text-ink/70 hover:text-pine transition text-left w-full">
          <span class="text-lg leading-none">‹</span> <span data-tk="recipe.back" id="recipeDetailBackLabel">Back</span>
        </button>
        <div id="recipeDetailHero" class="w-full aspect-video shrink-0 bg-ink/10 overflow-hidden" style="position: relative;">
          <span data-tk-attr="aria-label:recipe.markFavourite" id="recipeDetailFavBtn" role="button" tabindex="0" class="recipe-fav-btn recipe-fav-large" aria-label="Mark as favourite"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>
          <img id="recipeDetailHeroImg" class="hidden w-full h-full object-cover" alt="" />
          <div id="recipeDetailHeroPlaceholder" class="w-full h-full grid place-items-center text-4xl opacity-20">🍽️</div>
        </div>
        <div class="px-5 py-4">
          <h1 id="recipeDetailTitle" class="font-serif text-2xl font-bold mb-2"></h1>
          <div id="recipeDetailMeta" class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-ink/50 mb-3"></div>
          <div id="recipeDetailCategories" class="flex flex-wrap gap-1.5 mb-4"></div>
          <p id="recipeDetailSource" class="hidden text-xs text-ink/50 -mt-2 mb-4"></p>

          <div class="flex items-center justify-between gap-2 mb-4 rounded-xl border border-ink/10 bg-ink/[0.03] px-3 py-2.5">
            <span data-tk="recipe.servings" class="text-xs uppercase tracking-wide text-ink/40">Servings</span>
            <div class="flex items-center gap-1.5 shrink-0">
              <button data-tk-attr="aria-label:recipe.fewerPeople" id="recipeDetailServingsMinus" class="w-7 h-7 rounded-full border border-ink/20 text-ink/60 hover:border-pine hover:text-pine transition grid place-items-center text-xs" aria-label="Fewer people">–</button>
              <span id="recipeDetailServingsLabel" class="text-sm font-medium w-20 text-center"></span>
              <button data-tk-attr="aria-label:recipe.morePeople" id="recipeDetailServingsPlus" class="w-7 h-7 rounded-full border border-ink/20 text-ink/60 hover:border-pine hover:text-pine transition grid place-items-center text-xs" aria-label="More people">+</button>
            </div>
          </div>

          <div id="recipeDetailToolsWrap" class="hidden mb-4">
            <h3 data-tk="recipe.tools" class="text-xs uppercase tracking-wide text-ink/40 mb-1.5">Kitchen appliances</h3>
            <p id="recipeDetailTools" class="text-sm text-ink/70"></p>
          </div>

          <h3 data-tk="recipe.ingredients" class="text-xs uppercase tracking-wide text-ink/40 mb-1.5">Ingredients</h3>
          <div id="recipeDetailIngredients" class="mb-5"></div>

          <h3 data-tk="recipe.method" class="text-xs uppercase tracking-wide text-ink/40 mb-1.5">Method</h3>
          <div id="recipeDetailSteps" class="mb-5"></div>

          <div class="flex gap-2 pt-2 border-t border-ink/10">
            <button data-tk="recipe.planDay" id="recipeDetailPlanBtn" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-mustard hover:border-mustard transition">📅 Plan for one day</button>
            <button data-tk="common.edit" id="recipeDetailEditBtn" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-pine hover:border-pine transition">Edit</button>
            <button data-tk="common.delete" id="recipeDetailDeleteBtn" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-red-500 hover:border-red-500 transition">Delete</button>
            <button data-tk="recipe.addToMine" id="recipeDetailAdoptBtn" class="hidden px-3 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">＋ Add to my recipes</button>
          </div>
        </div>
      </div>
    </section>

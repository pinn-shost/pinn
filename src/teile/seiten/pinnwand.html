    <!-- Pin board -->
    <section id="pinboardSection" class="hidden min-h-0 flex-col bg-white/40">
      <div class="px-4 sm:px-6 pt-4 pb-3 border-b border-ink/10 shrink-0">
        <div class="flex items-center justify-between gap-3">
          <h2 data-tk="nav.board" class="font-serif text-lg">Board</h2>
          <div class="flex items-center gap-2 shrink-0">
            <button data-tk="board.arrange" data-tk-attr="title:board.moveNotesLongPress" id="pinboardArrangeBtn" type="button" class="px-3 py-1.5 rounded-lg border border-ink/15 text-xs font-medium hover:bg-ink/5 transition whitespace-nowrap" title="Move notes – or long-press a note">↕︎ Arrange</button>
            <button data-tk="board.note" id="openPinboardEditorBtn" type="button" class="px-3 py-1.5 rounded-lg bg-pine text-white text-xs font-medium hover:bg-pine/90 transition whitespace-nowrap">+ Note</button>
          </div>
        </div>
        <div id="pinboardChips" class="pw-chips mt-3"></div>
      </div>
      <div id="pinboardScroll" class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-6">
        <div id="pinboardQuick" class="pw-quick">
          <input data-tk-attr="placeholder:board.quicklyPinSomethingEveryone;aria-label:board.quicklyPinSomething" id="pinboardQuickInput" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" maxlength="2000" placeholder="Quickly pin something for everyone …" aria-label="Quickly pin something" />
          <button data-tk-attr="aria-label:board.pinOptions;title:board.optionsTypeColourWhom" id="pinboardQuickMore" type="button" aria-label="Pin with options" title="With options (type, colour, for whom, reminder …)">⋯</button>
          <button data-tk-attr="aria-label:board.pin;title:board.pin" id="pinboardQuickAdd" type="button" class="pw-quick-add" aria-label="Pin" title="Pin">+</button>
        </div>
        <div data-tk="board.dragReleaseNotesTap" id="pinboardArrangeHint" class="pw-arr-hint hidden">✋ Drag and release notes – tap an empty spot or “Done” to finish</div>
        <div id="pinboardBoard"></div>
      </div>
    </section>

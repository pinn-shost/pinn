    <section id="pantrySection" class="hidden min-h-0 flex-col bg-white/40">
      <div class="px-4 sm:px-6 pt-4 pb-3 border-b border-ink/10 shrink-0">
        <div class="flex items-center justify-between gap-3">
          <h2 data-tk="pantry.title" class="font-serif text-lg">Pantry</h2>
          <div class="flex items-center gap-2 shrink-0">
            <button data-tk-attr="title:pantry.whatCanICook;aria-label:pantry.whatCanICook" id="openPantryCookBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center text-base leading-none" aria-label="What can I cook?" title="What can I cook?">🍳</button>
            <button data-tk-attr="title:pantry.scanBarcode;aria-label:pantry.scanBarcode" id="openPantryScanBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center" aria-label="Scan barcode" title="Scan barcode">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 8v8"></path><path d="M10 8v8"></path><path d="M13 8v8"></path><path d="M17 8v8"></path></svg>
            </button>
            <button data-tk-attr="title:pantry.placesCategories;aria-label:pantry.placesCategories" id="openPantrySettingsBtn" type="button" class="w-9 h-9 rounded-lg border border-ink/15 text-ink/60 hover:text-pine hover:border-pine transition grid place-items-center" aria-label="Storage locations &amp; categories" title="Storage locations &amp; categories">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M1 14h6"></path><path d="M9 8h6"></path><path d="M17 16h6"></path></svg>
            </button>
            <button data-tk="pantry.addItemBtn" id="openPantryItemBtn" type="button" class="px-3 py-1.5 rounded-lg bg-pine text-white text-xs font-medium hover:bg-pine/90 transition whitespace-nowrap">+ Item</button>
          </div>
        </div>
        <div class="flex items-center gap-2 mt-3">
          <input data-tk-attr="placeholder:pantry.searchPlaceholder" id="pantrySearchInput" type="search" autocomplete="off" placeholder="Searching …" class="flex-1 min-w-0 rounded-lg border border-ink/15 px-3 py-1.5 text-base" />
          <button data-tk="pantry.filterLow" id="pantryLowToggle" type="button" class="pantry-chip shrink-0 px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 transition whitespace-nowrap">⚠️ Low</button>
          <button data-tk="pantry.filterExpiring" id="pantryExpToggle" type="button" class="pantry-chip shrink-0 px-3 py-1.5 rounded-lg border border-ink/15 text-xs text-ink/60 transition whitespace-nowrap">⏳ Expiring</button>
        </div>
        <div class="flex items-center gap-2 mt-2 flex-wrap">
          <div data-tk-attr="aria-label:pantry.sorting" class="inline-flex rounded-lg border border-ink/15 p-0.5 shrink-0" role="tablist" aria-label="Sorting">
            <button data-tk="pantry.sortCategory" type="button" data-pgroup="category" class="pantry-group-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Category</button>
            <button data-tk="pantry.sortPlace" type="button" data-pgroup="location" class="pantry-group-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Place</button>
            <button type="button" data-pgroup="alpha" class="pantry-group-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">A–Z</button>
            <button data-tk="pantry.sortBestBefore" type="button" data-pgroup="mhd" class="pantry-group-btn px-3 py-1 rounded-md text-xs text-ink/60 transition">Best before</button>
          </div>
          <select id="pantryLocationFilter" class="min-w-0 flex-1 sm:flex-none rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white"></select>
          <select id="pantryCategoryFilter" class="min-w-0 flex-1 sm:flex-none rounded-lg border border-ink/15 px-2 py-1.5 text-xs bg-white"></select>
        </div>
      </div>
      <div class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-4">
        <div id="pantryExpInfo" class="hidden max-w-3xl mx-auto mb-3 rounded-xl border px-3 py-2 text-xs flex items-center gap-2 pantry-exp-info">
          <span id="pantryExpInfoText" class="flex-1 min-w-0"></span>
          <button data-tk="pantry.whatToCook" id="pantryExpCookBtn" type="button" class="shrink-0 px-2.5 py-1 rounded-lg bg-white/70 border border-current text-[11px] font-medium whitespace-nowrap">🍳 What to cook?</button>
        </div>
        <div id="pantryLowInfo" class="hidden max-w-3xl mx-auto mb-3 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-700"></div>
        <div id="pantryList" class="max-w-3xl mx-auto flex flex-col gap-4"></div>
        <p id="pantryEmpty" class="hidden text-sm text-ink/40 italic mt-6 text-center"></p>
      </div>
    </section>

<!-- Pin board: add / edit a note -->
<div id="pinboardEditModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[300] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button id="closePinboardEditBtn" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Schließen">×</button>
    <h3 id="pinboardEditTitle" class="font-serif text-lg mb-4 pr-6">Neuer Zettel</h3>

    <div id="pwTypePicker" class="pw-types mb-4"></div>

    <div id="pwFieldTitleWrap" class="mb-3">
      <label id="pwTitleLabel" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="pwTitleInput">Überschrift</label>
      <input id="pwTitleInput" type="text" autocomplete="off" maxlength="120" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
    </div>
    <div id="pwFieldPhotoWrap" class="hidden mb-3">
      <button id="pwPhotoPickBtn" type="button" class="pw-photo-pick"><span>📷 Foto aufnehmen oder auswählen</span></button>
      <input id="pwPhotoInput" type="file" accept="image/*" class="hidden" />
    </div>
    <div id="pwFieldDateWrap" class="hidden mb-3">
      <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="pwDateInput">Wann ist es so weit?</label>
      <input id="pwDateInput" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
    </div>
    <div id="pwFieldTextWrap" class="mb-3">
      <label id="pwTextLabel" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="pwTextInput">Nachricht</label>
      <textarea id="pwTextInput" rows="4" maxlength="2000" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base"></textarea>
    </div>
    <div id="pwFieldItemsWrap" class="hidden mb-3">
      <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="pwItemsInput">Punkte – einer pro Zeile</label>
      <textarea id="pwItemsInput" rows="5" maxlength="4000" placeholder="Badesachen&#10;Sonnencreme&#10;Ladekabel" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base"></textarea>
      <p class="text-[11px] text-ink/40 mt-1">Jede*r kann die Punkte auf der Pinnwand abhaken und weitere hinzufügen.</p>
    </div>
    <div id="pwFieldOptionsWrap" class="hidden mb-3">
      <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1">Antworten</label>
      <div id="pwOptionsList"></div>
      <button id="pwAddOptionBtn" type="button" class="text-xs text-pine font-medium mt-1">+ Antwort hinzufügen</button>
    </div>

    <label id="pwToLabel" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Für wen?</label>
    <div id="pwToPicker" class="pw-people mb-1.5"></div>
    <p id="pwToHint" class="text-[11px] text-ink/40 mb-4"></p>

    <div id="pwColorWrap">
      <label class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Farbe</label>
      <div id="pwColorPicker" class="pw-colors mb-4"></div>
    </div>

    <div class="mb-2">
      <label class="pw-switch-row"><span class="pw-switch"><input id="pwPinnedToggle" type="checkbox" /><i></i></span><span class="pw-switch-text">📌 Oben anheften<small>Bleibt ganz oben auf der Pinnwand</small></span></label>
      <label class="pw-switch-row"><span class="pw-switch"><input id="pwImportantToggle" type="checkbox" /><i></i></span><span class="pw-switch-text">❗ Wichtig<small>Rot markiert – die Push-Nachricht kommt auch bei allen an, die nur Zettel „an mich“ erhalten</small></span></label>
      <label class="pw-switch-row"><span class="pw-switch"><input id="pwRemindToggle" type="checkbox" /><i></i></span><span class="pw-switch-text">⏰ Erinnern<small>Push-Nachricht zur gewählten Zeit (an die Empfänger bzw. alle)</small></span></label>
      <div id="pwRemindWrap" class="hidden pw-sub"><input id="pwRemindInput" type="datetime-local" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" /></div>
      <label class="pw-switch-row"><span class="pw-switch"><input id="pwExpiresToggle" type="checkbox" /><i></i></span><span class="pw-switch-text">🗓️ Automatisch abnehmen<small>Nach diesem Tag wandert der Zettel ins Archiv</small></span></label>
      <div id="pwExpiresWrap" class="hidden pw-sub"><input id="pwExpiresInput" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" /></div>
    </div>

    <p id="pwEditError" class="hidden text-xs text-red-500 mb-3"></p>
    <div class="flex items-center gap-2 mt-3">
      <button id="deletePinboardNoteBtn" type="button" class="hidden px-3 py-2 rounded-lg border border-red-300 text-sm text-red-500 hover:bg-red-50 transition">Löschen</button>
      <div class="flex-1"></div>
      <button id="cancelPinboardEditBtn" type="button" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:bg-ink/5 transition">Abbrechen</button>
      <button id="savePinboardNoteBtn" type="button" class="px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Anpinnen</button>
    </div>
  </div>
</div>

<!-- Pin board: view a note (replies, reactions, actions) -->
<div id="pinboardDetailModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[300] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button id="closePinboardDetailBtn" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none z-10" aria-label="Schließen">×</button>
    <div id="pinboardDetailBody" class="pt-3"></div>
    <h4 class="text-xs uppercase tracking-wide text-ink/40 mb-2 mt-1">Antworten</h4>
    <div id="pinboardThread" class="pw-thread"></div>
    <div id="pinboardReplyWrap" class="pw-reply">
      <textarea id="pinboardReplyInput" rows="1" maxlength="1000" enterkeyhint="send" placeholder="Antworten …" class="rounded-lg border border-ink/15 px-3 py-2 text-base"></textarea>
      <button id="pinboardReplyBtn" type="button" class="shrink-0 px-3 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Senden</button>
    </div>
    <div id="pinboardDetailActions" class="pw-actions"></div>
  </div>
</div>

<!-- Pin board: large photo -->
<div id="pinboardLightbox" class="hidden fixed inset-0">
  <button id="pinboardLightboxClose" type="button" aria-label="Schließen">✕</button>
  <img id="pinboardLightboxImg" alt="" />
</div>

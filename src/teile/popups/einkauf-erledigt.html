<!-- Planned shopping done: book the amount per shop/list -->
<div id="shoppingPlanDoneModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[310] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button data-tk-attr="aria-label:common.close" id="closePlanDoneBtn" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Close">×</button>
    <div class="mb-3 pr-6">
      <h3 data-tk="shop.done.title" class="font-serif text-lg leading-tight">Shopping done 🎉</h3>
      <p id="planDoneTaskTitle" class="text-xs text-ink/50 truncate"></p>
    </div>
    <p data-tk="shop.done.hint" class="text-xs text-ink/60 mb-3">Enter per shop what you paid and what you got. Bought items disappear from the list, everything else stays. Name and category are prefilled and can be changed. Shops without an amount are not booked.</p>

    <div id="planDoneLists" class="flex flex-col gap-3 mb-4"></div>

    <div class="grid grid-cols-2 gap-3 mb-3">
      <div class="min-w-0">
        <label data-tk="shop.complete.date" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="planDoneDateInput">Date</label>
        <input id="planDoneDateInput" type="date" class="w-full rounded-lg border border-ink/15 px-2.5 py-2 text-sm" />
      </div>
      <div class="fin-paidby-wrap min-w-0">
        <label data-tk="shop.complete.paidBy" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="planDonePaidBySelect">Paid by</label>
        <select id="planDonePaidBySelect" class="w-full rounded-lg border border-ink/15 px-2.5 py-2 text-sm bg-white"></select>
      </div>
    </div>


    <div class="flex items-center justify-between gap-3 rounded-xl bg-ink/5 px-3 py-2 mb-2">
      <span data-tk="shop.done.total" class="text-xs uppercase tracking-wide text-ink/40">Total</span>
      <span id="planDoneTotal" class="text-base font-semibold">0,00 €</span>
    </div>
    <p id="planDoneBudgetHint" class="hidden text-xs text-ink/60 mb-3"></p>
    <p id="planDoneError" class="hidden text-xs text-red-500 mb-3"></p>

    <div class="flex flex-col gap-2 mt-1">
      <button data-tk="shop.done.book" id="planDoneSaveBtn" type="button" class="w-full px-4 py-2.5 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Book amounts in Finance</button>
      <button data-tk="shop.done.withoutAmounts" id="planDoneSkipBtn" type="button" class="w-full px-4 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-pine hover:border-pine transition">Complete without amounts</button>
    </div>
  </div>
</div>

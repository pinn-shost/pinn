<!-- Planned shopping done: book the amount per shop/list -->
<div id="shoppingPlanDoneModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[310] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button id="closePlanDoneBtn" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Schließen">×</button>
    <div class="mb-3 pr-6">
      <h3 class="font-serif text-lg leading-tight">Einkauf erledigt 🎉</h3>
      <p id="planDoneTaskTitle" class="text-xs text-ink/50 truncate"></p>
    </div>
    <p class="text-xs text-ink/60 mb-3">Trag je Laden ein, was du bezahlt hast und was du bekommen hast. Gekaufte Artikel verschwinden von der Liste, alles andere bleibt stehen. Name und Kategorie sind vorausgefüllt und lassen sich ändern. Läden ohne Betrag werden nicht gebucht.</p>

    <div id="planDoneLists" class="flex flex-col gap-3 mb-4"></div>

    <div class="grid grid-cols-2 gap-3 mb-3">
      <div class="min-w-0">
        <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="planDoneDateInput">Datum</label>
        <input id="planDoneDateInput" type="date" class="w-full rounded-lg border border-ink/15 px-2.5 py-2 text-sm" />
      </div>
      <div class="fin-paidby-wrap min-w-0">
        <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="planDonePaidBySelect">Bezahlt von</label>
        <select id="planDonePaidBySelect" class="w-full rounded-lg border border-ink/15 px-2.5 py-2 text-sm bg-white"></select>
      </div>
    </div>


    <div class="flex items-center justify-between gap-3 rounded-xl bg-ink/5 px-3 py-2 mb-2">
      <span class="text-xs uppercase tracking-wide text-ink/40">Gesamt</span>
      <span id="planDoneTotal" class="text-base font-semibold">0,00 €</span>
    </div>
    <p id="planDoneBudgetHint" class="hidden text-xs text-ink/60 mb-3"></p>
    <p id="planDoneError" class="hidden text-xs text-red-500 mb-3"></p>

    <div class="flex flex-col gap-2 mt-1">
      <button id="planDoneSaveBtn" type="button" class="w-full px-4 py-2.5 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Beträge in Finanzen buchen</button>
      <button id="planDoneSkipBtn" type="button" class="w-full px-4 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-pine hover:border-pine transition">Ohne Beträge abschließen</button>
    </div>
  </div>
</div>

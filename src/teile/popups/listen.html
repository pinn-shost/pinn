<!-- Lists: new list (choose a template) / edit list -->
<div id="lsListModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[300] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button data-tk-attr="aria-label:common.close" id="lsListClose" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Close">×</button>
    <h3 data-tk="lists.modal.newTitle" id="lsListTitle" class="font-serif text-lg mb-1 pr-6">New list</h3>
    <p id="lsListSubtitle" class="text-xs text-ink/45 mb-3"></p>

    <div id="lsTplPane">
      <div id="lsTplGrid"></div>
    </div>

    <div id="lsFormPane" class="hidden">
      <label data-tk="common.name" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsListName">Name</label>
      <input id="lsListName" type="text" autocomplete="off" maxlength="60" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base mb-3" />

      <label data-tk="lists.modal.icon" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Icon</label>
      <div id="lsListIcons" class="flex flex-wrap gap-1.5 mb-3"></div>

      <div id="lsListOwnerWrap" class="hidden mb-3">
        <label data-tk="lists.modal.whoseWish" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Whose wish list?</label>
        <div id="lsListOwner" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div id="lsListDateWrap" class="hidden mb-3">
        <label data-tk="lists.modal.date" id="lsListDateLabel" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsListDate">Date</label>
        <input id="lsListDate" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
      </div>

      <!-- Packing list: destination & period (triggers the holiday weather) -->
      <div id="lsTripWrap" class="hidden mb-3">
        <label data-tk="lists.modal.destination" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsTripPlace">Destination</label>
        <div id="lsTripChosen" class="hidden ls-trip-chosen"></div>
        <div id="lsTripSug" class="home-sug"></div>
        <input data-tk-attr="placeholder:lists.modal.destinationPlaceholder" id="lsTripPlace" type="text" autocomplete="off" maxlength="120" enterkeyhint="search" placeholder="e.g. Mallorca, Cornwall, Rome" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
        <div class="ls-trip-dates">
          <div><label data-tk="lists.modal.departure" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsTripFrom">Departure</label><input id="lsTripFrom" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" /></div>
          <div><label data-tk="lists.modal.return" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsTripTo">Return</label><input id="lsTripTo" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" /></div>
        </div>
        <div id="lsTripWx" class="hidden ls-trip-wx"></div>
        <label id="lsTripTipsWrap" class="hidden items-center gap-2 mt-2 text-sm cursor-pointer select-none"><input id="lsTripTips" type="checkbox" class="w-4 h-4" checked /><span data-tk="lists.modal.weatherHint">🌦️ Weather-based: add rain jacket, sunscreen &amp; co. to the list</span></label>
      </div>

      <div id="lsListPersonsWrap" class="hidden mb-3">
        <label data-tk="lists.modal.forWhom" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Who is being packed for?</label>
        <div id="lsListPersons" class="flex flex-wrap gap-1.5"></div>
        <p data-tk="lists.modal.forWhomHint" class="text-[11px] text-ink/40 mt-1.5">Clothing &amp; co. then appears on the list for each person individually – shared items only once.</p>
      </div>

      <div id="lsListDaysWrap" class="hidden mb-3">
        <label data-tk="lists.modal.days" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsListDays">How many days?</label>
        <input data-tk-attr="placeholder:lists.modal.daysPlaceholder" id="lsListDays" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="e.g. 7" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
        <p data-tk="lists.modal.daysHint" class="text-[11px] text-ink/40 mt-1">This determines the number of underwear, socks etc.</p>
      </div>

      <label id="lsListPrivateWrap" class="hidden items-center gap-2 mb-3 text-sm cursor-pointer select-none">
        <input id="lsListPrivate" type="checkbox" class="w-4 h-4" />
        <span data-tk="lists.modal.private">🔒 Only visible to me</span>
      </label>

      <p id="lsListError" class="hidden text-xs text-red-500 mb-3"></p>
      <div class="flex items-center gap-2 mt-1 flex-wrap">
        <button data-tk="common.delete" id="lsListDeleteBtn" type="button" class="hidden px-3 py-2 rounded-lg border border-red-300 text-sm text-red-500 hover:bg-red-50 transition">Delete</button>
        <button data-tk="lists.modal.templates" id="lsListBackBtn" type="button" class="hidden px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:bg-ink/5 transition">‹ Templates</button>
        <div class="flex-1"></div>
        <button data-tk="common.cancel" id="lsListCancelBtn" type="button" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:bg-ink/5 transition">Cancel</button>
        <button data-tk="common.create" id="lsListSaveBtn" type="button" class="px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Create</button>
      </div>
    </div>
  </div>
</div>

<!-- Lists: edit an entry -->
<div id="lsItemModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[300] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button data-tk-attr="aria-label:common.close" id="lsItemClose" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Close">×</button>
    <h3 data-tk="lists.item.editTitle" id="lsItemTitle" class="font-serif text-lg mb-4 pr-6">Edit entry</h3>

    <label data-tk="lists.item.entry" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsItemText">Entry</label>
    <input id="lsItemText" type="text" autocomplete="off" maxlength="160" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base mb-3" />

    <div id="lsItemSectionWrap" class="hidden mb-3">
      <label data-tk="lists.section" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsItemSection">Area</label>
      <input data-tk-attr="placeholder:lists.item.sectionPlaceholder" id="lsItemSection" type="text" autocomplete="off" maxlength="40" list="lsItemSectionList" placeholder="e.g. clothing" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
      <datalist id="lsItemSectionList"></datalist>
    </div>

    <div id="lsItemWhoWrap" class="hidden mb-3">
      <label data-tk="lists.item.forWhom" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">For whom?</label>
      <div id="lsItemWho" class="flex flex-wrap gap-1.5"></div>
    </div>

    <div id="lsItemForWrap" class="hidden mb-3">
      <label data-tk="lists.item.giftFor" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Gift for</label>
      <div id="lsItemFor" class="flex flex-wrap gap-1.5 mb-2"></div>
      <input data-tk-attr="placeholder:lists.item.giftForPlaceholder" id="lsItemForName" type="text" autocomplete="off" maxlength="40" placeholder="or enter a name, e.g. Grandma Helga" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
    </div>

    <div id="lsItemStatusWrap" class="hidden mb-3">
      <label data-tk="lists.item.status" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">As of</label>
      <div id="lsItemStatus" class="flex flex-wrap gap-1.5"></div>
    </div>

    <div id="lsItemPriceLinkWrap" class="hidden grid-cols-2 gap-3 mb-3">
      <div class="min-w-0">
        <label class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsItemPrice"><span data-tk="lists.item.price">Price</span> (<span class="cur-sym">€</span>)</label>
        <input data-tk-attr="placeholder:lists.item.pricePlaceholder" id="lsItemPrice" type="text" inputmode="decimal" autocomplete="off" maxlength="12" placeholder="e.g. 24.99" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
      </div>
      <div class="min-w-0">
        <label data-tk="lists.item.link" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsItemLink">Link</label>
        <input id="lsItemLink" type="url" autocomplete="off" maxlength="500" placeholder="https://…" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base" />
      </div>
    </div>

    <label data-tk="lists.item.note" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="lsItemNote">Note</label>
    <input data-tk-attr="placeholder:lists.item.notePlaceholder" id="lsItemNote" type="text" autocomplete="off" maxlength="160" placeholder="optional" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-base mb-3" />

    <p id="lsItemError" class="hidden text-xs text-red-500 mb-3"></p>
    <div class="flex items-center gap-2 mt-1 flex-wrap">
      <button data-tk="common.delete" id="lsItemDeleteBtn" type="button" class="px-3 py-2 rounded-lg border border-red-300 text-sm text-red-500 hover:bg-red-50 transition">Delete</button>
      <button data-tk="lists.item.missingShop" id="lsItemShopBtn" type="button" class="hidden px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-pine hover:border-pine transition">🛒 Missing – buy</button>
      <div class="flex-1"></div>
      <button data-tk="common.cancel" id="lsItemCancelBtn" type="button" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:bg-ink/5 transition">Cancel</button>
      <button data-tk="common.save" id="lsItemSaveBtn" type="button" class="px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Save</button>
    </div>
  </div>
</div>

<!-- Lists: put a missing entry on a shopping list -->
<div id="lsShopModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[310] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button data-tk-attr="aria-label:common.close" id="lsShopClose" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Close">×</button>
    <h3 data-tk="lists.shop.title" class="font-serif text-lg mb-1 pr-6">Which shopping list?</h3>
    <p id="lsShopSubtitle" class="text-xs text-ink/45 mb-4"></p>
    <div id="lsShopGrid" class="ls-shop-grid"></div>
  </div>
</div>

<!-- Meal planning modal -->
<div id="mealModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[200] grid place-items-center p-6">
  <div class="bg-white rounded-2xl p-6 w-full max-w-sm fade-in overflow-hidden">
    <h3 data-tk="meal.title" class="font-serif text-lg mb-1">Plan meals</h3>
    <label data-tk="meal.date" class="block text-xs uppercase tracking-wide text-ink/40 mb-1">Date</label>
    <input id="mealModalDate" type="date" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm mb-4" />
    <label data-tk="meal.slot" class="block text-xs uppercase tracking-wide text-ink/40 mb-2">Meal</label>
    <div class="flex items-center gap-1 bg-ink/5 rounded-full p-1 text-xs w-fit mb-4">
      <button data-tk="meal.breakfast" type="button" data-meal="fruehstueck" class="meal-type-btn px-3 py-1.5 rounded-full transition">🌅 Breakfast</button>
      <button data-tk="meal.lunch" type="button" data-meal="mittag" class="meal-type-btn px-3 py-1.5 rounded-full transition">☀️ Lunch</button>
      <button data-tk="meal.dinner" type="button" data-meal="abend" class="meal-type-btn px-3 py-1.5 rounded-full transition">🌙 Evening</button>
    </div>
    <label data-tk="meal.recipe" class="block text-xs uppercase tracking-wide text-ink/40 mb-1">Recipe</label>
    <div class="relative mb-3">
      <input data-tk-attr="placeholder:meal.searchRecipe" id="mealRecipeSearch" type="text" autocomplete="off" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm" placeholder="Search recipe …" />
      <button data-tk-attr="aria-label:meal.clear" type="button" id="clearMealRecipeBtn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-ink/30 hover:text-ink/60 text-sm leading-none" aria-label="Clear selection">×</button>
      <div id="mealRecipeSuggestions" class="hidden absolute z-10 left-0 right-0 mt-1 max-h-56 overflow-y-auto bg-white rounded-lg border border-ink/15 shadow-lg"></div>
    </div>
    <label data-tk="meal.ownTitle" class="block text-xs uppercase tracking-wide text-ink/40 mb-1">Or custom title (if no recipe fits)</label>
    <input data-tk-attr="placeholder:meal.ownTitlePlaceholder" id="mealFreeTitle" class="w-full rounded-lg border border-ink/15 px-3 py-2 text-sm mb-5" placeholder="e.g. leftovers from yesterday" />

    <div class="flex items-center justify-between gap-2 mb-5 rounded-xl border border-ink/10 bg-ink/[0.03] px-3 py-2.5">
      <span data-tk="meal.servings" class="text-xs uppercase tracking-wide text-ink/40">Servings on this day</span>
      <div class="flex items-center gap-1.5 shrink-0">
        <button data-tk-attr="aria-label:recipe.fewerServings" type="button" id="mealServingsMinusBtn" class="w-7 h-7 rounded-full border border-ink/20 text-ink/60 hover:border-pine hover:text-pine transition grid place-items-center text-xs" aria-label="Fewer servings">–</button>
        <span id="mealServingsValue" class="text-sm font-medium w-8 text-center">2</span>
        <button data-tk-attr="aria-label:recipe.moreServings" type="button" id="mealServingsPlusBtn" class="w-7 h-7 rounded-full border border-ink/20 text-ink/60 hover:border-pine hover:text-pine transition grid place-items-center text-xs" aria-label="More servings">+</button>
      </div>
    </div>
    <div class="flex justify-end gap-2">
      <button data-tk="common.cancel" id="cancelMeal" class="px-3 py-2 rounded-lg text-sm text-ink/60 hover:text-ink">Cancel</button>
      <button data-tk="common.save" id="saveMeal" class="px-4 py-2 rounded-lg bg-mustard text-white text-sm font-medium hover:bg-mustard/90">Save</button>
    </div>
  </div>
</div>

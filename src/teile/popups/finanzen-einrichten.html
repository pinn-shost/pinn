<!-- Set up finances: budget, categories, recurring expenses, export -->
<div id="financeSettingsModal" class="hidden fixed inset-0 bg-ink/30 backdrop-blur-sm z-[300] grid place-items-center p-4 sm:p-6">
  <div class="relative bg-white rounded-2xl shadow-xl max-w-lg w-full p-5 max-h-[90vh] overflow-y-auto fade-in">
    <button id="closeFinanceSettingsBtn" type="button" class="absolute top-3 right-3 w-7 h-7 rounded-full text-ink/40 hover:text-ink hover:bg-ink/5 transition grid place-items-center text-lg leading-none select-none" aria-label="Close" data-tk-attr="aria-label:common.close">×</button>
    <h3 data-tk="fin.setUpFinance" class="font-serif text-lg mb-4 pr-6">Set up finance</h3>

    <button id="finSettingsKassenBtn" type="button" class="w-full flex items-center gap-3 rounded-xl border border-ink/10 px-3 py-2.5 mb-5 text-left hover:border-pine transition">
      <span class="w-9 h-9 rounded-full bg-pine/10 grid place-items-center text-lg shrink-0">💶</span>
      <span class="flex-1 min-w-0">
        <span data-tk="fund.funds" class="block text-sm font-medium">Funds</span>
        <span data-tk="fin.switchCreateNewFund" id="finSettingsKassenInfo" class="block text-[11px] text-ink/45 truncate">Switch, create a new fund, set up members</span>
      </span>
      <span class="text-ink/30 text-lg shrink-0">›</span>
    </button>

    <div class="mb-6">
      <h4 data-tk="fin.householdBudget" class="text-xs uppercase tracking-wide text-ink/40 mb-1">Household budget</h4>
      <p data-tk="fin.budgetSumYourIncome" class="text-xs text-ink/50 mb-2">The budget is the sum of your income in the period – one-off and recurring (e.g. salary with a minus in front). Here you can increase it every month by a fixed amount or decrease it with a minus.</p>
      <label data-tk="fin.adjustmentPerMonth" class="block text-xs uppercase tracking-wide text-ink/40 mb-1" for="finBudgetInput">Adjustment per month</label>
      <div id="finBudgetField" class="fin-amount-field flex items-center gap-2 rounded-xl border border-ink/15 pl-2 pr-4 py-2">
        <button id="finBudgetSignBtn" type="button" class="shrink-0 w-10 h-10 rounded-lg border border-ink/15 text-xl font-semibold text-ink/60 hover:border-pine hover:text-pine transition grid place-items-center select-none" aria-label="Set or remove minus (minus = decrease budget)" title="Minus = decrease budget" data-tk-attr="aria-label:fin.setRemoveMinusMinus2;title:fin.minusDecreaseBudget">±</button>
        <input id="finBudgetInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" data-cur-zero class="flex-1 min-w-0 bg-transparent border-0 p-0 text-2xl font-semibold tracking-tight" />
        <span class="cur-sym text-xl text-ink/40">€</span>
      </div>
      <p id="finBudgetInfo" class="text-xs text-ink/50 mt-1.5"></p>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between gap-3 mb-2">
        <h4 data-tk="cat.categories" class="text-xs uppercase tracking-wide text-ink/40">Categories</h4>
        <button data-tk="cat.addCategory" id="finAddCategoryBtn" type="button" class="px-2.5 py-1 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition">+ Category</button>
      </div>
      <div id="finCategoryEditor" class="flex flex-col gap-2"></div>
    </div>

    <div class="mb-6">
      <div class="flex items-center justify-between gap-3 mb-2">
        <h4 data-tk="fin.recurringExpensesIncome" class="text-xs uppercase tracking-wide text-ink/40">Recurring expenses &amp; income</h4>
        <button data-tk="fin.add" id="finAddRecurringBtn" type="button" class="px-2.5 py-1 rounded-lg border border-ink/15 text-xs text-ink/60 hover:text-pine hover:border-pine transition">+ Add</button>
      </div>
      <div id="finRecurringList" class="flex flex-col"></div>
    </div>

    <div class="mb-5">
      <h4 data-tk="fin.export" class="text-xs uppercase tracking-wide text-ink/40 mb-2">Export</h4>
      <div class="flex items-center gap-2">
        <select id="finExportYear" class="rounded-lg border border-ink/15 px-2.5 py-2 text-sm bg-white"></select>
        <button data-tk="fin.transactionsAsCsv" id="finExportBtn" type="button" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:text-pine hover:border-pine transition">Transactions as CSV</button>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 pt-4 border-t border-ink/10">
      <button data-tk="common.cancel" id="cancelFinanceSettingsBtn" type="button" class="px-3 py-2 rounded-lg border border-ink/15 text-sm text-ink/60 hover:bg-ink/5 transition">Cancel</button>
      <button data-tk="common.save" id="saveFinanceSettingsBtn" type="button" class="px-4 py-2 rounded-lg bg-pine text-white text-sm font-medium hover:bg-pine/90 transition">Save</button>
    </div>
  </div>
</div>

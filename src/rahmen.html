<script>
  // Start check: if a self-hosted file is missing, a clear notice appears instead of an
  // empty page with buttons that do nothing.
  // Parts of the app under pb_public/js/ – every file registers itself in window.PINN_PARTS at its end
  var PINN_APP_PARTS = [{{PINN_APP_PARTS}}];
  // Styles of the app under pb_public/css/ (since 1.96) – every file is a <link> at the place of the former
  // <style> block: almost all in the head of index.html, terminal and glocke (since 1.98) at the end of the page
  var PINN_APP_STYLES = [{{PINN_APP_STYLES}}];
  window.addEventListener('DOMContentLoaded', function () {
    var missing = [];
    if (!window.PocketBase) missing.push('<b>vendor/pocketbase/pocketbase.umd.js</b> – the PocketBase client (nothing works without it)');
    var probe = document.createElement('div');
    probe.className = 'hidden';
    document.body.appendChild(probe);
    if (getComputedStyle(probe).display !== 'none') missing.push('<b>vendor/pinn.css</b> – the styles');
    probe.remove();
    var loadedParts = window.PINN_PARTS || [];
    PINN_APP_PARTS.forEach(function (part) {
      if (loadedParts.indexOf(part) === -1) missing.push('<b>js/' + part + '.js</b> – a part of the app');
    });
    // Texts of the chosen language (pb_public/i18n/<code>.i18n.js, since 1.111.0)
    if (window.PINN_I18N && PINN_I18N.keysMissing) missing.push('<b>' + PINN_I18N.keysMissing + '</b> – the texts of the app');
    // A CSS file counts as loaded when the browser has taken over its rules (a 404 or a delivered
    // index.html result in no stylesheet or one without rules)
    function fehlendeStyles() {
      var out = [];
      PINN_APP_STYLES.forEach(function (name) {
        var link = document.querySelector('link[rel="stylesheet"][href^="css/' + name + '.css"]');
        var ok = false;
        try { ok = !!(link && link.sheet && link.sheet.cssRules.length); } catch (e) { ok = false; }
        if (!ok) out.push('<b>css/' + name + '.css</b> – a part of the app');
      });
      return out;
    }
    // The browser may still be loading the files at the end of the page (after the js/ files) when DOMContentLoaded
    // fires – then only check for good after the page has loaded completely (load)
    if (fehlendeStyles().length && document.readyState !== 'complete') {
      window.addEventListener('load', function () { melden(missing.concat(fehlendeStyles())); });
      return;
    }
    melden(missing.concat(fehlendeStyles()));
    // Show the notice (only if something is missing)
    function melden(missing) {
      if (!missing.length) return;
      // Which addresses does the server really deliver? (shows the status of each file, helps with a wrong folder/name)
      var checks = [
        'vendor/pinn.css',
        'vendor/pocketbase/pocketbase.umd.js',
        'vendor/pocketbase/pocketbase_umd.js',
        'vendor/pocketbase.umd.js',
        'vendor/pocketbase_umd.js'
      ].concat(PINN_APP_STYLES.map(function (name) { return 'css/' + name + '.css'; }))
        .concat(PINN_APP_PARTS.map(function (part) { return 'js/' + part + '.js'; }))
        .concat(window.PINN_I18N && PINN_I18N.keysMissing ? [PINN_I18N.keysMissing] : []);
      var box = document.createElement('div');
      box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#FFFBFB;font-family:system-ui,sans-serif;color:#25231F;overflow:auto;');
      box.innerHTML = '<div style="max-width:460px;line-height:1.5">'
        + '<div style="font-size:20px;font-weight:700;margin-bottom:10px">pinn. cannot start</div>'
        + '<p style="margin:0 0 10px">Missing on the NAS in the folder <code>pb_public/</code>:</p>'
        + '<ul style="margin:0 0 14px;padding-left:20px">' + missing.map(function (m) { return '<li>' + m + '</li>'; }).join('') + '</ul>'
        + '<p style="margin:0 0 6px;font-size:13px;font-weight:600">What the server answers:</p>'
        + '<div id="pinnStartChecks" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;margin:0 0 14px;word-break:break-all">checking …</div>'
        + '<p style="margin:0 0 16px;font-size:14px;color:#6b6760">Expected: <code>pb_public/vendor/pinn.css</code>, <code>pb_public/vendor/pocketbase/pocketbase.umd.js</code> and the files in <code>pb_public/js/</code> – in the same <code>pb_public</code> as this <code>index.html</code>. Upper/lower case matters.</p>'
        + '<button type="button" onclick="location.href=location.pathname+\'?_r=\'+Date.now()" style="padding:10px 16px;border-radius:10px;border:0;background:#00374A;color:#fff;font-size:15px">Reload</button>'
        + '</div>';
      document.body.appendChild(box);
      var out = document.getElementById('pinnStartChecks');
      var lines = [];
      function show() { out.innerHTML = lines.join('<br>'); }
      checks.forEach(function (path, i) {
        lines[i] = path + ' → …';
        fetch(path + '?_r=' + Date.now(), { cache: 'no-store' }).then(function (res) {
          var type = res.headers.get('Content-Type') || '';
          var okType = /\.css$/.test(path) ? /css/.test(type) : /javascript|ecmascript/.test(type);
          // For unknown paths PocketBase may deliver index.html - that does not count as found
          var found = res.ok && okType;
          lines[i] = (found ? '✅ ' : '❌ ') + path + ' → ' + res.status + (res.ok && !okType ? ' (' + (type.split(';')[0] || 'unknown type') + ', not the file)' : '');
          show();
        }).catch(function () {
          lines[i] = '❌ ' + path + ' → no answer';
          show();
        });
      });
      show();
    }
  });
</script>

<script>
// Moving notes (see "Zettel verschieben" in the pin board section) - created early because renderPinboard uses them
var PW_LONGPRESS_MS = 450;
var pwArr = { on: false, press: null, drag: null, quietUntil: 0, renderPending: false, ro: null, layoutQueued: false, raf: 0 };
/* ==========================================================
   iOS: prevent the double-tap offset
   ========================================================== */
// A quick double tap on empty areas makes iOS scroll the document a little. Because
// #appRoot is fixed, you only see a short jump - but afterwards every touch target
// is shifted up by exactly this amount. 1) If the document slips, set it back to 0/0 at once.
// 2) Don't let the second quick tap on non-interactive areas through at all.
window.addEventListener('scroll', () => {
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}, { passive: true });

(function preventIosDoubleTapShift() {
  let lastTouchEnd = 0;
  const INTERACTIVE = 'input, textarea, select, button, a, label, [contenteditable], [draggable="true"], [role="button"], [onclick], [data-allow-doubletap]';
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    const quickSecondTap = now - lastTouchEnd < 350;
    lastTouchEnd = now;
    if (!quickSecondTap || e.touches.length > 0) return;
    if (e.target.closest && e.target.closest(INTERACTIVE)) return;
    e.preventDefault();
  }, { passive: false });
})();

const PB_COLLECTION = 'familien_daten';
const ICS_URL = '/api/pinn/kalender'; // only available after sign-in (pb_hooks/benutzer.pb.js)
let familyRecordId = null; // set after the login
let lastIcsSync = null;

/* ==========================================================
   App version & update detection (important for use from the home screen on iOS,
   because such web apps often don't reload their content by themselves)
   ========================================================== */
// Current version – comes from src/version.txt (filled in by src/build.js); pb_hooks/pinn-system.js and pinn-wartung.sh read it here
const APP_VERSION = '{{VERSION}}';

/* ==========================================================
   Settings & account: two columns of equal height (landscape from tablet width)
   ----------------------------------------------------------
   The cards are split into left/right in their order so that both columns are as high as possible
   in the COLLAPSED state (first left from top to bottom, then right).
   Expanding and collapsing only changes the height of the card - it stays in its column, the cards
   below move along. It is only redistributed when the width changes, the page is opened or
   cards are shown/hidden. A ResizeObserver instead of constant polling keeps this easy on the CPU.
   ========================================================== */
(function setMasonry() {
  const GAP = 12; // 0.75rem
  const mq = window.matchMedia ? window.matchMedia('(orientation: landscape) and (min-width: 768px)') : null;
  const panes = Array.from(document.querySelectorAll('#settingsView .set-pane, #accountView .set-pane'));
  if (!panes.length || typeof ResizeObserver === 'undefined') return;
  const st = new Map(); // pane -> { left: Set, vis: [el], width, raf }
  panes.forEach(p => st.set(p, { left: new Set(), vis: [], width: 0, raf: 0 }));
  let active = false;

  function items(pane) {
    const out = [];
    Array.from(pane.children).forEach(el => {
      if (el.id === 'profileAdminSection') { Array.from(el.children).forEach(c => out.push(c)); return; }
      out.push(el);
    });
    return out;
  }
  function isVisible(el) { return el.getClientRects().length > 0 && el.offsetHeight > 0; }
  // Height in the collapsed state (expanded settings only count with their heading)
  function closedHeight(el) {
    if (el.tagName === 'DETAILS' && el.open) {
      const sum = el.querySelector(':scope > summary');
      if (sum) return sum.offsetHeight + (el.offsetHeight - el.clientHeight);
    }
    return el.offsetHeight;
  }
  function assign(pane) {
    const s = st.get(pane);
    const vis = items(pane).filter(isVisible);
    const hs = vis.map(closedHeight);
    const total = hs.reduce((a, b) => a + b + GAP, 0);
    let best = vis.length, bestDiff = Infinity, acc = 0;
    for (let k = 0; k <= vis.length; k++) {
      const left = acc, right = total - acc;
      const diff = Math.max(left, right);
      if (diff < bestDiff - 0.5) { bestDiff = diff; best = k; }
      if (k < vis.length) acc += hs[k] + GAP;
    }
    s.left = new Set(vis.slice(0, best));
    s.vis = vis;
  }
  function place(pane) {
    const s = st.get(pane);
    const y = [0, 0];
    s.vis.forEach(el => {
      if (!el.isConnected) return;
      const col = s.left.has(el) ? 0 : 1;
      el.style.left = col ? 'calc(50% + 0.375rem)' : '0px';
      el.style.top = y[col] + 'px';
      y[col] += el.offsetHeight + GAP;
    });
    pane.style.height = Math.max(0, Math.max(y[0], y[1]) - GAP) + 'px';
  }
  function sameSet(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }
  function layout(pane, force) {
    const s = st.get(pane);
    if (!active) return;
    const w = pane.clientWidth;
    if (!w) return; // page not visible right now
    const vis = items(pane).filter(isVisible);
    if (force || w !== s.width || !sameSet(vis, s.vis)) {
      s.width = w;
      assign(pane);
    }
    place(pane);
    if (!pane.classList.contains('set-masonry-ready')) requestAnimationFrame(() => pane.classList.add('set-masonry-ready'));
  }
  function schedule(pane, force) {
    const s = st.get(pane);
    if (force) s.force = true;
    if (s.raf) return;
    s.raf = requestAnimationFrame(() => { s.raf = 0; const f = s.force; s.force = false; layout(pane, f); });
  }
  const ro = new ResizeObserver(entries => {
    entries.forEach(en => {
      const pane = panes.find(p => p === en.target || p.contains(en.target));
      if (pane) schedule(pane, false);
    });
  });
  function observeItems() {
    panes.forEach(p => { ro.observe(p); items(p).forEach(el => ro.observe(el)); });
  }
  function on() {
    if (active) return;
    active = true;
    panes.forEach(p => { p.classList.add('set-masonry'); st.get(p).width = 0; st.get(p).vis = []; });
    observeItems();
    panes.forEach(p => schedule(p, true));
  }
  function off() {
    if (!active) return;
    active = false;
    ro.disconnect();
    panes.forEach(p => {
      p.classList.remove('set-masonry', 'set-masonry-ready');
      p.style.height = '';
      items(p).forEach(el => { el.style.left = ''; el.style.top = ''; });
    });
  }
  function check() { if (!mq || mq.matches) on(); else off(); }
  // Also observe newly inserted cards (e.g. sections loaded later)
  const mo = new MutationObserver(() => { if (!active) return; observeItems(); panes.forEach(p => schedule(p, false)); });
  panes.forEach(p => {
    mo.observe(p, { childList: true });
    const pa = p.querySelector(':scope > #profileAdminSection');
    if (pa) mo.observe(pa, { childList: true });
  });
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', check); else if (mq.addListener) mq.addListener(check); }
  window.addEventListener('orientationchange', () => setTimeout(check, 250));
  check();
})();


</script>

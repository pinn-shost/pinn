# pinn. – builds the ready-made Docker image for Portainer / Docker (since 1.151.0)
#
# Runs when a release is published (and on request via "Run workflow"):
#   1. builds the image (docker/Dockerfile) for the PC/NAS processor (amd64) and starts it once:
#      /api/health must answer, so a broken image is never published
#   2. builds it for amd64 and arm64 and publishes it as ghcr.io/<owner>/<repo> with the tags
#      <version> (e.g. 1.151.0), <major>.<minor> (1.151) and – for finished versions – latest
# The versions of PocketBase and the PDF/OCR libraries are read from docker-compose.yaml and pinn-setup.sh,
# so they are maintained in one place only.
# ONCE after the first run: GitHub → your profile/organisation → Packages → "pinn" → Package settings →
# "Change visibility" → Public (otherwise Portainer cannot pull the image without a login).

name: Image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Read the versions (PocketBase, PDF.js, Tesseract)
        id: v
        run: |
          pb=$(sed -n 's/^x-pocketbase-version: &pb-version "\(.*\)"/\1/p' docker-compose.yaml)
          pdfjs=$(sed -n 's/^PDFJS_VERSION=\(.*\)/\1/p' pinn-setup.sh)
          tess=$(sed -n 's/^TESSERACT_VERSION=\(.*\)/\1/p' pinn-setup.sh)
          core=$(sed -n 's/^TESSERACT_CORE_VERSION=\(.*\)/\1/p' pinn-setup.sh)
          deu=$(sed -n 's/^TESSERACT_DEU_VERSION=\(.*\)/\1/p' pinn-setup.sh)
          echo "pb=$pb pdfjs=$pdfjs tesseract=$tess core=$core deu=$deu"
          for x in "$pb" "$pdfjs" "$tess" "$core" "$deu"; do [ -n "$x" ] || { echo "A version could not be read"; exit 1; }; done
          {
            echo "pb=$pb"
            echo "pdfjs=$pdfjs"
            echo "tess=$tess"
            echo "core=$core"
            echo "deu=$deu"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build for the test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pinn-test:latest
          build-args: |
            PB_VERSION=${{ steps.v.outputs.pb }}
            PDFJS_VERSION=${{ steps.v.outputs.pdfjs }}
            TESSERACT_VERSION=${{ steps.v.outputs.tess }}
            TESSERACT_CORE_VERSION=${{ steps.v.outputs.core }}
            TESSERACT_DEU_VERSION=${{ steps.v.outputs.deu }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image once (health check)
        run: |
          docker run -d --name pinn-test -p 8090:80 pinn-test:latest
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs pinn-test || true
          [ "$ok" = 1 ] || { echo "The image did not become healthy"; exit 1; }
          curl -fsS http://127.0.0.1:8090/ | grep -q "pinn" || { echo "The start page is missing"; exit 1; }
          docker exec pinn-test ls /pb_public/vendor/pdfjs/pdf.min.mjs /pb_public/vendor/tesseract/lang/deu.traineddata.gz
          docker rm -f pinn-test

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for amd64 and arm64 and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PB_VERSION=${{ steps.v.outputs.pb }}
            PDFJS_VERSION=${{ steps.v.outputs.pdfjs }}
            TESSERACT_VERSION=${{ steps.v.outputs.tess }}
            TESSERACT_CORE_VERSION=${{ steps.v.outputs.core }}
            TESSERACT_DEU_VERSION=${{ steps.v.outputs.deu }}
          cache-from: type=gha

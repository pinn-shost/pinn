# pinn. – creates language files with the Claude API (started by hand: Actions → Translate → Run workflow).
# Needs the repository secret ANTHROPIC_API_KEY. Nothing is committed: the finished files are offered
# as download "pinn-languages" at the bottom of the run page.
name: Translate

on:
  workflow_dispatch:
    inputs:
      languages:
        description: 'Language codes, separated by commas'
        required: true
        default: 'pt,it,zh,ja,ko'
      model:
        description: 'Claude model'
        required: true
        default: 'claude-opus-5-5'

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.m.outputs.langs }}
    steps:
      - id: m
        env:
          LANGS: ${{ inputs.languages }}
        run: |
          node -e '
            const l = process.env.LANGS.split(/[\s,;]+/).filter(Boolean);
            const bad = l.filter(c => !/^[a-z]{2}(-[A-Z]{2})?$/.test(c) || c === "en" || c === "de");
            if (!l.length || bad.length) { console.error("Invalid language codes: " + (bad.join(", ") || "none")); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "langs=" + JSON.stringify([...new Set(l)]) + "\n");
          '

  translate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJson(needs.setup.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Results of earlier (also aborted) runs, so nothing is paid twice
      - uses: actions/cache/restore@v4
        with:
          path: .translate-cache
          key: translate-${{ matrix.lang }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: translate-${{ matrix.lang }}-
      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: node .github/scripts/translate.js --lang "${{ matrix.lang }}" --model "$MODEL" --parallel 4
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .translate-cache
          key: translate-${{ matrix.lang }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check
        run: node .github/scripts/check-lang.js "${{ matrix.lang }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lang-${{ matrix.lang }}
          path: |
            pb_public/lang/${{ matrix.lang }}.js
            translate-report-${{ matrix.lang }}.txt
          if-no-files-found: warn

  bundle:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lang-*
          merge-multiple: true
          path: pinn-languages
      - uses: actions/upload-artifact@v4
        with:
          name: pinn-languages
          path: pinn-languages
          if-no-files-found: error

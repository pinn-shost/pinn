# ─────────────────────────────────────────────────────────────
#  pinn. – Docker project (PocketBase + HTTPS via Caddy/DuckDNS + detour to the Home Assistant VM
#  + optional Tailscale + optional Traccar for GPS trackers + maintenance: backups & updates at the push of a button)
#  No port forwarding needed – certificate via DNS challenge.
#
#  SET-UP: Everything needed (DuckDNS, Google, AI, Home Assistant, Tailscale …) you enter in pinn.
#  itself: open http://<NAS-IP>:8090 → "Sign in as main admin" → the set-up wizard
#  starts. The values end up in the folder ./konfig (pinn.env) and are read by all containers –
#  nothing has to be changed here or in the .env for that any more.
#
#  The values below and in the .env are only defaults now: whatever is saved in the wizard applies.
#  First installation: sudo sh pinn-setup.sh (sorts all files and starts pinn.)
#  Updates afterwards by button in pinn. (Settings → System) or, as before, with pinn-setup.sh.
#  Project & guide: https://github.com/pinn-shost/pinn
# ─────────────────────────────────────────────────────────────
x-pinn-config: &pinn-config
  DUCKDNS_SUBDOMAIN: ""                     # default – comes from the set-up in pinn.
  DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:-}"       # default from the .env (optional)
  NAS_IP: ""                                # default – local IP of the NAS (empty = the set-up detects it)

x-ha-netz-config: &ha-netz-config
  NAS_NETZWERKKARTE: "auto"                 # default – "auto" = detect by itself
  HA_IP: ""                                 # default – Home Assistant (VM on the NAS), empty = no detour
  HILFS_IP: ""                              # default – free address in the home network, outside the DHCP range

# PocketBase version: is built on start directly from the official GitHub releases
# (checksum is verified). New version = change the number + "docker compose up -d".
# Before every version jump it is best to run the script ./pinn-pocketbase-update.sh
# (backs up beforehand, checks the hooks and shows errors).
x-pocketbase-version: &pb-version "0.40.3"

x-backup-config: &backup-config
  BACKUP_UHRZEIT: "03:30"                   # daily backup at this time
  BACKUP_TAGE: "7"                          # all backups of the last 7 days are kept …
  BACKUP_WOCHEN: "4"                        # … then one per week, for 4 weeks
  TZ: "Europe/Berlin"
# ─────────────────────────────────────────────────────────────
#  Backups end up as pinn_YYYY-MM-DD_HHMM.tar.gz in the folder ./backups
#  (contains database, uploaded files, pb_public, pb_hooks, Caddy, Traccar, konfig, Tailscale,
#   .env and this file – readable by root only, do not pass on).
#  Restore: in pinn. under Settings → System → Backups & updates (or as main admin
#  "🛟 Backups & updates"). Without the app: docker compose down → unpack the archive in the project folder
#  (tar -xzf backups/pinn_….tar.gz) → docker compose up -d
# ─────────────────────────────────────────────────────────────

services:

  pocketbase:
    # Own, slim image from the official PocketBase file (no third-party Docker image any more).
    # Is only rebuilt when the version above changes – otherwise it comes straight from the cache.
    build:
      context: ./pb_hooks          # only needed as a placeholder, nothing is copied from it
      dockerfile_inline: |
        FROM alpine:3.20
        ARG PB_VERSION
        RUN set -e; \
            apk add --no-cache ca-certificates tzdata wget; \
            case "$$(uname -m)" in \
              x86_64) A=amd64 ;; aarch64) A=arm64 ;; armv7l) A=armv7 ;; \
              *) echo "Unbekannte Architektur: $$(uname -m)"; exit 1 ;; \
            esac; \
            Z="pocketbase_$${PB_VERSION}_linux_$${A}.zip"; \
            U="https://github.com/pocketbase/pocketbase/releases/download/v$${PB_VERSION}"; \
            cd /tmp; \
            wget -q "$$U/$$Z"; \
            wget -q "$$U/checksums.txt"; \
            grep " $$Z" checksums.txt > pruefsumme.txt; \
            sha256sum -c pruefsumme.txt; \
            unzip -o "$$Z" pocketbase -d /usr/local/bin; \
            chmod +x /usr/local/bin/pocketbase; \
            rm -f /tmp/*; \
            apk del wget; \
            /usr/local/bin/pocketbase --version
      args:
        PB_VERSION: *pb-version
    image: pinn-pocketbase:aktuell
    pull_policy: build
    container_name: pocketbase
    restart: unless-stopped
    # Reads the values from the set-up (konfig/pinn.env) on start – they take precedence over .env and defaults.
    # After saving in the wizard, pinn. restarts itself, Docker brings it straight back.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        if [ -f "$$K" ]; then
          if ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a
          else echo "Einrichtung: $$K ist fehlerhaft und wird ignoriert"; fi
        fi
        exec pocketbase serve --http=0.0.0.0:80 --dir=/pb_data --publicDir=/pb_public --hooksDir=/pb_hooks --hooksWatch=false
    env_file:
      - .env               # optional defaults (key, Google, AI, Traccar) – the set-up in pinn. takes precedence
    environment:
      <<: [*pinn-config, *ha-netz-config]   # defaults, so that the wizard can show them
    ports:
      - "8090:80"          # only in the home network: http://<NAS-IP>:8090 (first set-up, emergency access)
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
      - ./pb_hooks:/pb_hooks
      - ./konfig:/pinn_konfig            # values from the set-up (pinn.env, einrichtung.json)
      - ./wartung:/pinn_wartung          # exchange with the container "wartung" (backups, updates)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: serfriz/caddy-duckdns:latest   # ready-made Caddy with the DuckDNS module, no build needed
    container_name: caddy
    restart: unless-stopped
    environment: *pinn-config
    ports:
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data        # certificates – do not delete
      - ./caddy/config:/config
      - ./konfig:/pinn_konfig:ro
    # Starts Caddy only once DuckDNS is set up, and restarts it as soon as the subdomain
    # or token change in the set-up. View the log: docker logs caddy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (DUCKDNS_SUBDOMAIN|DUCKDNS_TOKEN)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        PID=""; ALT="-"
        trap '[ -n "$$PID" ] && kill "$$PID" 2>/dev/null; exit 0' TERM INT
        while true; do
          NEU=$$(stand)
          if [ "$$NEU" != "$$ALT" ]; then
            ALT=$$NEU
            if [ -n "$$PID" ]; then kill "$$PID" 2>/dev/null; wait "$$PID" 2>/dev/null; PID=""; fi
            if ( lade; [ -n "$$DUCKDNS_SUBDOMAIN" ] && [ -n "$$DUCKDNS_TOKEN" ] ); then
              ( lade; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile ) &
              PID=$$!
              echo "$$(date '+%d.%m.%Y %H:%M') Caddy gestartet für $$(lade; echo "$$DUCKDNS_SUBDOMAIN").duckdns.org"
            else
              echo "$$(date '+%d.%m.%Y %H:%M') Caddy wartet auf die Einrichtung in pinn. (DuckDNS fehlt)"
            fi
          elif [ -n "$$PID" ] && ! kill -0 "$$PID" 2>/dev/null; then
            echo "$$(date '+%d.%m.%Y %H:%M') Caddy wurde beendet – Container startet neu"
            exit 1
          fi
          sleep 15 &
          wait $$!
        done
    depends_on:
      - pocketbase

  # OPTIONAL – only for GPS trackers with a SIM card (e.g. on a dog collar).
  # Phones do NOT need this container: they share their location directly in pinn. or send with
  # the "Traccar Client" app to pinn. (https://<pinn.>/api/pinn/ortung/osmand) – pinn. stores it itself.
  # Therefore it no longer starts automatically. To switch on: add the line
  #   COMPOSE_PROFILES=tracker
  # to the .env and run "docker compose up -d". To switch off: remove the line and
  # "docker rm -f traccar". The data in ./traccar is kept.
  # Traccar web interface: only on the NAS (see ports below), not needed for pinn.
  traccar:
    image: traccar/traccar:latest
    container_name: traccar
    restart: unless-stopped
    profiles: ["tracker"]
    ports:
      # Web interface and OsmAnd only on the NAS itself (pinn. talks internally via the Docker network).
      # Phones send via pinn. (https://<pinn.>/api/pinn/ortung/osmand) – with SOS detection.
      # Web interface if needed via SSH tunnel: ssh -L 8082:127.0.0.1:8082 <NAS> → http://localhost:8082
      - "127.0.0.1:8082:8082" # web interface / API
      - "127.0.0.1:5055:5055" # OsmAnd
      - "5023:5023"           # GT06 (many dog/car GPS trackers)
      - "5013:5013"           # H02
      - "5093:5093"           # Watch (children's/pet watches, 3G/4G trackers)
      - "5027:5027"           # Teltonika
    volumes:
      - ./traccar/data:/opt/traccar/data
      - ./traccar/logs:/opt/traccar/logs

  # Keeps the DuckDNS address current (points to the NAS's home network IP). Reads subdomain, token and
  # NAS IP from the set-up, reports hourly and immediately after every change. Log: docker logs duckdns
  duckdns:
    image: curlimages/curl:latest
    container_name: duckdns
    restart: unless-stopped
    user: "0:0"            # may read konfig/pinn.env (readable by root only, contains the token)
    environment: *pinn-config
    volumes:
      - ./konfig:/pinn_konfig:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (DUCKDNS_SUBDOMAIN|DUCKDNS_TOKEN|NAS_IP)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        ALT="-"; LETZTES=0
        while true; do
          NEU=$$(stand); JETZT=$$(date +%s)
          if [ "$$NEU" != "$$ALT" ] || [ $$((JETZT - LETZTES)) -ge 3600 ]; then
            ALT=$$NEU; LETZTES=$$JETZT
            (
              lade
              if [ -n "$$DUCKDNS_SUBDOMAIN" ] && [ -n "$$DUCKDNS_TOKEN" ] && [ -n "$$NAS_IP" ]; then
                echo "$$(date) DuckDNS: $$(curl -fsS "https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=$${NAS_IP}")"
              else
                echo "$$(date) DuckDNS wartet auf die Einrichtung in pinn."
              fi
            )
          fi
          sleep 30
        done

  # Detour to the Home Assistant VM: the VM is attached via macvtap directly to the network card – in doing so
  # Linux blocks the traffic between the NAS (and thus all containers) and the VM. This container
  # creates a second virtual network card on start (ha-shim, macvlan in bridge mode) with the
  # helper IP and routes the traffic to the VM over it. When it ends, everything is removed again.
  # Values from the set-up in pinn. (Smart home: Home Assistant), otherwise from "x-ha-netz-config" above.
  # Without HA_IP the container only waits. The state is in konfig/ha-netz.status for pinn.
  # Log ansehen: docker logs ha-netz
  # Test: docker exec pocketbase wget -qO- http://<HA_IP>:8123/api/   -> "401 Unauthorized" = reachable
  ha-netz:
    image: alpine:3.20
    container_name: ha-netz
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment: *ha-netz-config
    volumes:
      - ./konfig:/pinn_konfig
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        S=/pinn_konfig/ha-netz.status
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (HA_IP|HILFS_IP|NAS_NETZWERKKARTE|NAS_IP)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        status() { echo "$$1|$$2|$${HA_IP}|$${HILFS_IP}|$$(date '+%d.%m.%Y %H:%M')" > "$$S" 2>/dev/null; }
        ALT=$$(stand)
        lade
        if [ -z "$$HA_IP" ] || [ -z "$$HILFS_IP" ]; then
          status wartet ""
          echo "$$(date '+%d.%m.%Y %H:%M') Kein Home Assistant als VM eingerichtet – Umweg aus"
          while [ "$$(stand)" = "$$ALT" ]; do sleep 30; done
          exit 0
        fi
        until apk add --no-cache iproute2 >/dev/null; do
          echo "Pakete nicht ladbar – neuer Versuch in 60 s"; sleep 60
        done
        KARTE="$$NAS_NETZWERKKARTE"
        if [ -z "$$KARTE" ] || [ "$$KARTE" = "auto" ]; then
          [ -n "$$NAS_IP" ] && KARTE=$$(ip -o -4 addr show | awk -v ip="$$NAS_IP" '{split($$4,a,"/"); if (a[1]==ip) {print $$2; exit}}')
          [ -z "$$KARTE" ] && KARTE=$$(ip route show default | awk '{for(i=1;i<=NF;i++) if($$i=="dev"){print $$(i+1); exit}}')
          echo "Netzwerkkarte erkannt: $${KARTE:-keine}"
        fi
        N=0
        until ip link show "$$KARTE" >/dev/null 2>&1; do
          N=$$((N + 1)); status fehler "$$KARTE"
          echo "Warte auf Netzwerkkarte $$KARTE …"; sleep 10
          if [ "$$(stand)" != "$$ALT" ]; then exit 0; fi
        done
        aufraeumen() {
          ip route del "$${HA_IP}/32" dev ha-shim 2>/dev/null
          ip link del ha-shim 2>/dev/null
          echo "$$(date '+%d.%m.%Y %H:%M') Umweg zu $${HA_IP} entfernt"
          exit 0
        }
        trap aufraeumen TERM INT
        einrichten() {
          ip link show ha-shim >/dev/null 2>&1 || ip link add ha-shim link "$$KARTE" type macvlan mode bridge
          ip addr flush dev ha-shim 2>/dev/null
          ip addr replace "$${HILFS_IP}/32" dev ha-shim
          ip link set ha-shim up
          ip route replace "$${HA_IP}/32" dev ha-shim
        }
        if einrichten; then
          status aktiv "$$KARTE"
          echo "$$(date '+%d.%m.%Y %H:%M') Umweg aktiv: NAS -> ha-shim ($${HILFS_IP}) -> Home Assistant $${HA_IP}"
        else
          status fehler "$$KARTE"
        fi
        # Keeps running: checks every 30 s whether the set-up has changed (then restarts the
        # container with the new values), and every 5 minutes whether the detour is still in place.
        T=0
        while true; do
          sleep 30 &
          wait $$!
          if [ "$$(stand)" != "$$ALT" ]; then
            echo "$$(date '+%d.%m.%Y %H:%M') Einrichtung geändert – Umweg wird neu aufgebaut"
            aufraeumen
          fi
          T=$$((T + 30))
          if [ "$$T" -ge 300 ]; then
            T=0
            if ! ip route show "$${HA_IP}/32" | grep -q ha-shim; then
              einrichten && status aktiv "$$KARTE"
              echo "$$(date '+%d.%m.%Y %H:%M') Umweg wiederhergestellt"
            fi
          fi
        done

  # Optional: Tailscale – alternative to the WireGuard VPN of the FRITZ!Box (e.g. with other routers or
  # DS-Lite). Stays off until a Tailscale key is entered in pinn. under Set-up → "Use on the go".
  # Shares only the NAS address in the Tailscale network (subnet route <NAS_IP>/32),
  # runs without extra privileges (userspace). Log: docker logs tailscale
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    restart: unless-stopped
    environment:
      <<: *pinn-config
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_HOSTNAME: pinn
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./konfig:/pinn_konfig:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (TS_AUTHKEY|NAS_IP)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        ALT=$$(stand)
        lade
        if [ -z "$$TS_AUTHKEY" ]; then
          echo "$$(date '+%d.%m.%Y %H:%M') Tailscale aus – wartet auf einen Schlüssel aus der Einrichtung in pinn."
          while [ "$$(stand)" = "$$ALT" ]; do sleep 30; done
          exit 0
        fi
        export TS_ROUTES="$${NAS_IP}/32"
        echo "$$(date '+%d.%m.%Y %H:%M') Tailscale startet (Route $${TS_ROUTES})"
        /usr/local/bin/containerboot &
        PID=$$!
        trap 'kill "$$PID" 2>/dev/null; exit 0' TERM INT
        while kill -0 "$$PID" 2>/dev/null; do
          sleep 30
          if [ "$$(stand)" != "$$ALT" ]; then
            echo "Einrichtung geändert – Tailscale startet neu"
            kill "$$PID" 2>/dev/null; wait "$$PID" 2>/dev/null
            exit 0
          fi
        done
        exit 1

  # Maintenance: daily backup during operation (rotating: 7 days + 4 weeks, see above),
  # restore and updates by button in pinn. (Settings → System → Backups & updates).
  # The work is done by the script pinn-wartung.sh in the project folder. For restore and updates
  # the container needs access to Docker (stop pinn. briefly, apply the update) – that is why
  # /var/run/docker.sock is mounted. Jobs only come from pinn. via the folder ./wartung;
  # updates only from the official GitHub repository (PINN_REPO).
  # View the log: docker logs wartung · Backup by hand: docker exec wartung sh /projekt/pinn-wartung.sh sichern
  wartung:
    image: docker:cli
    container_name: wartung
    restart: unless-stopped
    environment:
      <<: *backup-config
      PINN_REPO: "pinn-shost/pinn"
    volumes:
      - ./:/projekt
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /projekt/pinn-wartung.sh ]; then exec sh /projekt/pinn-wartung.sh; fi
        echo "pinn-wartung.sh fehlt im Projektordner – bitte sudo sh pinn-setup.sh ausführen"
        sleep 300
        exit 1

  #    - "5013:5013"             # H02
  #    - "5093:5093"             # Watch (children's/pet watches, 3G/4G trackers)
  #    - "5027:5027"             # Teltonika
  #  volumes:
  #    - traccar_data:/opt/traccar/data
  #    - traccar_logs:/opt/traccar/logs


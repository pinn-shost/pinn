# ─────────────────────────────────────────────────────────────
#  pinn. – stack for Portainer (Stack UI / Web editor) and plain "docker compose" – NO set-up script, NO project folder.
#  (since 1.151.0)
#
#  How to use:
#   Portainer → Stacks → Add stack → Web editor → paste this file → (optional) set the variables
#   under "Environment variables" → Deploy the stack.
#   Then open  http://<NAS-IP>:8090  → "Sign in as main admin" → the set-up wizard starts (DuckDNS, Google, AI …).
#   Update: Stacks → your stack → Editor → "Update the stack" with "Re-pull image and redeploy" switched on.
#   Guide: https://github.com/pinn-shost/pinn#portainer-stack-no-script
#
#  Everything is stored in volumes (no folders needed). No fixed container names – the stack does not clash
#  with containers you already have (e.g. your own Tailscale).
#  Backups: the service "wartung" (below) makes a backup every night (03:30, 7 days + 4 weeks kept) and does the buttons
#  "Back up now" / "Restore" in pinn. → Settings → System. Backups land in the volume "backups" – or in a folder of the NAS,
#  if you set the variable PINN_BACKUP_DIR (e.g. /volume1/docker/pinn-backups). Updates are NOT done by button here:
#  Portainer → your stack → "Update the stack" with "Re-pull image and redeploy".
#  Optional (commented out at the end, remove the "#" to switch on): Traccar (GPS trackers with a SIM card) and the
#  Home Assistant detour (only if Home Assistant runs as a VM on the NAS). Phones need neither of them.
#
#  Own reverse proxy (Nginx Proxy Manager, Traefik, Cloudflare Tunnel …) instead of Tailscale: point it to
#  http://<NAS-IP>:8090 – see the guide "Access from the internet with your own reverse proxy" on GitHub.
#
#  All variables are optional: whatever you save in the set-up wizard in pinn. takes precedence.
# ─────────────────────────────────────────────────────────────

x-pinn-config: &pinn-config
  DUCKDNS_SUBDOMAIN: ""                     # default – comes from the set-up in pinn.
  DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:-}"       # optional default (better: enter it in the set-up)
  NAS_IP: ""                                # default – local IP of the NAS (empty = the set-up detects it)

services:

  pinn:
    image: ghcr.io/pinn-shost/pinn:${PINN_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *pinn-config
      TZ: "${TZ:-Europe/Berlin}"
      PINN_SCHLUESSEL: "${PINN_SCHLUESSEL:-}"
      PINN_ADRESSE: "${PINN_ADRESSE:-}"
      PINN_GOOGLE_CLIENT_ID: "${PINN_GOOGLE_CLIENT_ID:-}"
      PINN_GOOGLE_CLIENT_SECRET: "${PINN_GOOGLE_CLIENT_SECRET:-}"
      PINN_GEMINI_KEY: "${PINN_GEMINI_KEY:-}"
      PINN_GEMINI_MODELL: "${PINN_GEMINI_MODELL:-}"
      PINN_PUSH_KONTAKT: "${PINN_PUSH_KONTAKT:-}"
      PINN_PROXY_NETZE: "${PINN_PROXY_NETZE:-}"   # own reverse proxy: which proxies may name the visitor (empty = home/Docker networks)
    ports:
      - "${PINN_PORT:-8090}:80"     # first set-up and access in the home network: http://<NAS-IP>:8090
    volumes:
      - data:/pb_data               # database and uploaded files – back this volume up
      - konfig:/pinn_konfig         # values from the set-up wizard
      - wartung:/pinn_wartung       # exchange with the backup service "wartung" (jobs, list of backups)

  # HTTPS with an address like <subdomain>.duckdns.org (certificate via DNS challenge, no port forwarding needed).
  # Starts working as soon as DuckDNS is set up in pinn. Skip this and "duckdns" if you use your own reverse proxy or Tailscale.
  caddy:
    image: serfriz/caddy-duckdns:latest
    restart: unless-stopped
    environment: *pinn-config
    ports:
      - "${PINN_HTTPS_PORT:-8443}:443"
      - "${PINN_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy_data:/data            # certificates – do not delete
      - caddy_config:/config
      - konfig:/pinn_konfig:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (DUCKDNS_SUBDOMAIN|DUCKDNS_TOKEN)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        # The Caddyfile is written here, so no file has to be put next to the stack
        cat > /tmp/Caddyfile <<'CADDYFILE'
        {
        	auto_https disable_redirects
        }
        {$$DUCKDNS_SUBDOMAIN}.duckdns.org {
        	tls {
        		dns duckdns {$$DUCKDNS_TOKEN}
        		resolvers 1.1.1.1 9.9.9.9
        	}
        	encode zstd gzip
        	reverse_proxy pinn:80
        }
        CADDYFILE
        PID=""; ALT="-"
        trap '[ -n "$$PID" ] && kill "$$PID" 2>/dev/null; exit 0' TERM INT
        while true; do
          NEU=$$(stand)
          if [ "$$NEU" != "$$ALT" ]; then
            ALT=$$NEU
            if [ -n "$$PID" ]; then kill "$$PID" 2>/dev/null; wait "$$PID" 2>/dev/null; PID=""; fi
            if ( lade; [ -n "$$DUCKDNS_SUBDOMAIN" ] && [ -n "$$DUCKDNS_TOKEN" ] ); then
              ( lade; exec caddy run --config /tmp/Caddyfile --adapter caddyfile ) &
              PID=$$!
              echo "$$(date '+%d.%m.%Y %H:%M') Caddy started for $$(lade; echo "$$DUCKDNS_SUBDOMAIN").duckdns.org"
            else
              echo "$$(date '+%d.%m.%Y %H:%M') Caddy is waiting for the set-up in pinn. (DuckDNS missing)"
            fi
          elif [ -n "$$PID" ] && ! kill -0 "$$PID" 2>/dev/null; then
            echo "$$(date '+%d.%m.%Y %H:%M') Caddy ended – container restarts"
            exit 1
          fi
          sleep 15 &
          wait $$!
        done
    depends_on:
      - pinn

  # Keeps the DuckDNS address current (reports hourly and immediately after every change).
  duckdns:
    image: curlimages/curl:latest
    restart: unless-stopped
    user: "0:0"            # may read the values of the set-up (readable by root only, contains the token)
    environment: *pinn-config
    volumes:
      - konfig:/pinn_konfig:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (DUCKDNS_SUBDOMAIN|DUCKDNS_TOKEN|NAS_IP)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        ALT="-"; LETZTES=0
        while true; do
          NEU=$$(stand); JETZT=$$(date +%s)
          if [ "$$NEU" != "$$ALT" ] || [ $$((JETZT - LETZTES)) -ge 3600 ]; then
            ALT=$$NEU; LETZTES=$$JETZT
            (
              lade
              if [ -n "$$DUCKDNS_SUBDOMAIN" ] && [ -n "$$DUCKDNS_TOKEN" ] && [ -n "$$NAS_IP" ]; then
                echo "$$(date) DuckDNS: $$(curl -fsS "https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=$${NAS_IP}")"
              else
                echo "$$(date) DuckDNS is waiting for the set-up in pinn."
              fi
            )
          fi
          sleep 30
        done

  # Optional: Tailscale (reach pinn. on the go). Stays off until a Tailscale key is entered in pinn. under
  # Set-up → "Use on the go". Delete this whole block if Tailscale already runs on your NAS – then simply use
  # http://<Tailscale address of the NAS>:8090.
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      <<: *pinn-config
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_HOSTNAME: "${TS_HOSTNAME:-pinn}"
    volumes:
      - tailscale:/var/lib/tailscale
      - konfig:/pinn_konfig:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        K=/pinn_konfig/pinn.env
        lade() { if [ -f "$$K" ] && ( . "$$K" ) >/dev/null 2>&1; then set -a; . "$$K"; set +a; fi; }
        stand() { grep -E '^export (TS_AUTHKEY|NAS_IP)=' "$$K" 2>/dev/null | md5sum | cut -d' ' -f1; }
        ALT=$$(stand)
        lade
        if [ -z "$$TS_AUTHKEY" ]; then
          echo "$$(date '+%d.%m.%Y %H:%M') Tailscale is off - waiting for a key from the set-up in pinn."
          while [ "$$(stand)" = "$$ALT" ]; do sleep 30; done
          exit 0
        fi
        export TS_ROUTES="$${NAS_IP}/32"
        echo "$$(date '+%d.%m.%Y %H:%M') Tailscale starts (route $${TS_ROUTES})"
        /usr/local/bin/containerboot &
        PID=$$!
        trap 'kill "$$PID" 2>/dev/null; exit 0' TERM INT
        while kill -0 "$$PID" 2>/dev/null; do
          sleep 30
          if [ "$$(stand)" != "$$ALT" ]; then
            echo "Set-up changed - Tailscale restarts"
            kill "$$PID" 2>/dev/null; wait "$$PID" 2>/dev/null
            exit 0
          fi
        done
        exit 1

  # Backups and restore (nightly + by button in pinn.). Runs the backup script that is part of the pinn. image.
  # Needs the Docker socket to stop/start pinn. briefly for a restore. It only takes jobs from pinn. (folder "wartung")
  # and never downloads or runs anything else. Remove this block if you back up the volumes yourself in another way –
  # then pinn. shows a hint instead of the backup list.
  wartung:
    image: ghcr.io/pinn-shost/pinn:${PINN_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      BACKUP_UHRZEIT: "${BACKUP_UHRZEIT:-03:30}"   # time of the nightly backup
      BACKUP_TAGE: "${BACKUP_TAGE:-7}"             # keep every backup of the last N days ...
      BACKUP_WOCHEN: "${BACKUP_WOCHEN:-4}"         # ... then one per week for N weeks
    volumes:
      - data:/projekt/pb_data
      - konfig:/projekt/konfig
      - wartung:/projekt/wartung
      - "${PINN_BACKUP_DIR:-backups}:/projekt/backups"   # volume "backups", or a folder of your NAS if PINN_BACKUP_DIR is set
      # With Traccar switched on, also add:  - traccar_data:/projekt/traccar/data
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/usr/local/bin/pinn-wartung.sh"]
    depends_on:
      - pinn

  # Optional: Traccar – GPS trackers with a SIM card (dog/car trackers, children's watches). Phones do NOT need it.
  # To switch on: remove the "#" in front of the lines of this block (and of "traccar_data"/"traccar_logs" under volumes at
  # the end) and update the stack. pinn. finds it by itself under the name "traccar". The web interface and the phone
  # port are reachable only on the NAS itself; the trackers send to the NAS-IP and the ports below (forward them in
  # the router/FRITZ!Box if the trackers are not in your home network).
  #traccar:
  #  image: traccar/traccar:latest
  #  restart: unless-stopped
  #  ports:
  #    - "127.0.0.1:8082:8082"   # web interface / API (only on the NAS)
  #    - "127.0.0.1:5055:5055"   # OsmAnd (phones send via pinn.)
